<style>
:root{ --bg:#1A0F3A; --bg2:#2A1557; --text:#FFFFFF; --muted:#C9B8F0; --mag:#FF2BD6; --cyan:#27E3FF; --gold:#FFD23F; --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.16); --font:"Varela Round","Arial Rounded MT Bold",Arial,Helvetica,sans-serif }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg)}
body{font-family:var(--font);color:var(--text);font-size:18px;line-height:1.35;overflow-x:hidden;-webkit-font-smoothing:antialiased;touch-action:manipulation;background:radial-gradient(90vmax 70vmax at 50% 0%,#3B1E72,var(--bg) 60%,#110826)}
body.ingame{overflow:hidden}
#app{position:relative;max-width:640px;margin:0 auto;padding:10px 12px 20px}
body.ingame #app{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 8px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-weight:900;font-size:19px}
.icons{display:flex;gap:8px}
.ib{min-width:44px;min-height:44px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:900 17px/1 var(--font);cursor:pointer;padding:0 10px}
.ib:active{transform:translateY(1px);opacity:.8}
.screen{display:none}.screen.on{display:block}
.hero{text-align:center;padding:4px 0 2px}
.hero h1{margin:0;font-size:36px;letter-spacing:1px;text-shadow:0 0 10px var(--mag),0 0 28px rgba(255,43,214,.55)}
.hero h1 small{display:block;font-size:18px;color:var(--cyan);font-weight:700;margin-top:2px;text-shadow:0 0 10px rgba(39,227,255,.7);letter-spacing:2px}
.hero .tag{margin:8px 0 10px;color:var(--muted);font-size:17px}
.stats{display:flex;justify-content:center;gap:22px;font-size:21px;font-weight:900;margin:0 0 6px}
.stats span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;min-height:44px;display:inline-flex;align-items:center}
h2.choose{text-align:center;font-size:22px;letter-spacing:2px;margin:12px 0 8px;text-shadow:0 0 10px var(--cyan),0 0 22px rgba(39,227,255,.5)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{position:relative;border-radius:18px;background:var(--card);border:2px solid var(--line);padding:12px 8px 10px;text-align:center;cursor:pointer;color:var(--text);font:400 18px var(--font);min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.card:active{transform:translateY(2px)}
.card .ic{font-size:42px;line-height:1;filter:drop-shadow(0 0 8px rgba(255,255,255,.5))}
.card b{font-size:21px;letter-spacing:1px}
.card small{display:block;font-size:16px;color:var(--muted);line-height:1.25}
.card .lock{font-size:16px;color:var(--gold);line-height:1.25;font-weight:800}
.card.classic{border-color:var(--cyan);box-shadow:0 0 18px rgba(39,227,255,.35),inset 0 0 20px rgba(39,227,255,.08)}
.card.endless{border-color:#B14DFF}.card.endless.open{box-shadow:0 0 18px rgba(177,77,255,.4)}
.card.race{border-color:#FF6E9A}.card.race.open{box-shadow:0 0 18px rgba(255,110,154,.4)}
.card.locked{opacity:.7;filter:saturate(.6)}
@media (max-width:520px){.cards{grid-template-columns:1fr;gap:8px}.card{flex-direction:row;justify-content:flex-start;text-align:start;min-height:76px;padding:8px 12px;gap:12px}.card .ic{font-size:34px}}
.skinsbar{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 10px 6px}
.skinsbar .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.skinsbar .hd b{font-size:19px;letter-spacing:1px}
.skinsbar .hd button{min-height:44px}
.skinsbar .row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none;direction:ltr}
.skinsbar .row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:78px;height:96px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text);font:700 16px var(--font);padding:0}
.chip canvas{width:48px;height:48px;display:block}
.chip.eq{border-color:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.chip .pr{color:var(--gold);font-size:16px}
.chip .pr.own{color:var(--cyan)}
.how{color:var(--muted);font-size:16px;text-align:center;margin:12px 0 0}
.kbd{text-align:center;color:var(--muted);font-size:16px;margin:8px 0}
.kbd b{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:2px 9px;color:var(--text);font-size:16px}
footer{text-align:center;padding:14px 0 0;color:var(--muted);font-size:16px}
footer a{color:var(--gold);text-decoration:none;font-weight:800}
.btn{display:block;width:100%;max-width:360px;margin:12px auto;min-height:56px;border:0;border-radius:999px;background:var(--cyan);color:#0B1030;font:900 22px/1 var(--font);cursor:pointer;box-shadow:0 6px 0 #1596B0,0 0 22px rgba(39,227,255,.45);padding:0 20px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1596B0}
.btn.mag{background:var(--mag);color:#fff;box-shadow:0 6px 0 #A6148A,0 0 22px rgba(255,43,214,.45)}
.btn.mag:active{box-shadow:0 2px 0 #A6148A}
.btn.ghost{background:var(--card);color:var(--text);box-shadow:none;border:1px solid var(--line);min-height:48px;font-size:18px}
.btn small{display:block;font-size:15px;font-weight:700;opacity:.8;margin-top:3px}
.sel{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px auto 4px}
.sel .ib{font-size:22px;min-width:52px;min-height:52px}
.sel .name{min-width:170px;text-align:center;font-weight:900;font-size:22px}
.sel .name small{display:block;font-size:16px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0}
.tile{min-height:64px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:var(--text);font:900 19px/1.1 var(--font);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px 2px}
.tile small{font-size:16px;letter-spacing:1px;color:var(--gold);font-weight:700}
.tile small.off{color:rgba(255,255,255,.25)}
.tile.lock{opacity:.45;cursor:default}
.tile.cur{box-shadow:0 0 12px var(--cyan)}
.sub{text-align:center;color:var(--muted);font-size:16px;margin:4px 0}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
@media (max-width:380px){.sgrid{grid-template-columns:repeat(2,1fr)}}
.sk{border-radius:16px;border:2px solid var(--line);background:var(--card);padding:8px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.sk canvas{width:72px;height:72px;display:block}
.sk b{font-size:17px}
.sk .pr{color:var(--gold);font-size:16px;font-weight:700}
.sk button{min-height:44px;width:100%;border:0;border-radius:12px;background:var(--cyan);color:#0B1030;font:900 16px var(--font);cursor:pointer}
.sk button.own{background:var(--card);color:var(--text);border:1px solid var(--line)}
.sk button.eq{background:var(--mag);color:#fff}
.sk button:disabled{opacity:.45;cursor:default}
.sk.eq{border-color:var(--cyan);box-shadow:0 0 12px rgba(39,227,255,.5)}
.hidden{display:none!important}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-80px);background:#fff;color:#1A0F3A;padding:10px 16px;border-radius:14px;font-weight:800;z-index:60;transition:transform .3s;max-width:90vw;text-align:center;font-size:16px}
.toast.on{transform:translateX(-50%) translateY(0)}
/* ---- game ---- */
#s-game{position:fixed;inset:0;background:#0D0722;display:none;align-items:center;justify-content:center}
#s-game.on{display:flex}
#stage{position:relative;flex:none;width:960px;height:540px;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;display:flex;flex-wrap:wrap;row-gap:4px;justify-content:space-between;align-items:flex-start;padding:calc(6px + env(safe-area-inset-top)) 8px 0;pointer-events:none;z-index:5;font-weight:900;font-size:20px;text-shadow:0 0 8px rgba(0,0,0,.9),0 1px 2px #000}
#hud .g{display:flex;align-items:center;gap:6px;pointer-events:auto}
#hud .ib{background:rgba(13,7,34,.75);font-size:18px}
#hud .tx{padding:0 6px;white-space:nowrap;line-height:1}
#rotate{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));text-align:center;color:var(--muted);font-size:16px;display:none;pointer-events:none;padding:0 12px}
body.portrait #rotate{display:block}
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:8;pointer-events:none;padding:8px}
#ov.on{display:flex}
.panel{pointer-events:auto;background:rgba(26,15,58,.95);border:2px solid var(--mag);border-radius:22px;padding:14px 18px;text-align:center;max-width:min(94vw,440px);width:100%;box-shadow:0 0 30px rgba(255,43,214,.45),inset 0 0 30px rgba(39,227,255,.06)}
.panel h3{font-size:28px;margin:0 0 4px;letter-spacing:1px;text-shadow:0 0 12px var(--cyan)}
.panel .sr{font-size:42px;line-height:1.1;letter-spacing:4px;margin:2px 0}
.panel .sr span{opacity:.22}.panel .sr span.on{opacity:1;filter:drop-shadow(0 0 8px var(--gold))}
.panel p{margin:4px 0 8px;font-size:18px}
.panel .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.panel .btns button{min-height:48px;min-width:110px;border:0;border-radius:999px;font:900 18px var(--font);cursor:pointer;padding:0 16px;color:#0B1030;background:var(--cyan)}
.panel .btns button.alt{background:var(--card);color:var(--text);border:1px solid var(--line)}
.panel .btns button.mag{background:var(--mag);color:#fff}
#test-log{white-space:pre-wrap;font-family:monospace;font-size:12px;color:#fff;background:#000;padding:8px;direction:ltr}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Game Lab shared 🔑 code button + dialog (paste verbatim into every game's <style>) */
.gl-key{display:block;margin:12px auto 0;background:rgba(0,0,0,.1);border:2px solid rgba(0,0,0,.22);color:inherit;opacity:.85;font-weight:700;font-size:16px;line-height:1;font-family:inherit;padding:0 18px;cursor:pointer;border-radius:999px;min-height:44px;min-width:44px;white-space:nowrap}
.gl-key:hover,.gl-key:focus-visible{opacity:.95}
.gl-ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;z-index:99999;padding:12px;box-sizing:border-box}
.gl-card{background:#fff;color:#1f2430;border-radius:18px;padding:16px;width:100%;max-width:380px;max-height:88vh;overflow:auto;box-sizing:border-box;text-align:start;font:16px/1.4 system-ui,-apple-system,'Segoe UI',Arial,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.gl-card h3{margin:0 0 10px;font-size:22px;color:#1f2430}.gl-card h4{margin:14px 0 6px;font-size:16px;color:#1f2430}.gl-card p{margin:6px 0;color:#1f2430}
.gl-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
.gl-in{flex:1 1 120px;min-width:0;min-height:44px;border:2px solid #cfd6e4;border-radius:10px;padding:0 10px;font-size:16px;color:#1f2430;background:#fff;box-sizing:border-box;font-family:inherit}
.gl-n{flex:0 0 96px}
.gl-b{min-height:44px;border:0;border-radius:12px;padding:0 16px;font:700 16px system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:#2563eb;color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.gl-ghost{background:#eef1f7;color:#1f2430;width:100%;margin-top:10px}
.gl-wa{background:#25d366}
.gl-msg{min-height:22px;font-weight:700}.gl-msg.ok{color:#15803d}.gl-msg.bad{color:#b91c1c}
.gl-tb{width:100%;border-collapse:collapse;font-size:14px}.gl-tb td{padding:4px 6px;border-bottom:1px solid #e6eaf2;color:#1f2430}.gl-tb td:last-child{text-align:end;font-weight:700}.gl-tot td{font-weight:900;border-bottom:0}
.gl-code{font:700 18px/1.3 ui-monospace,Consolas,monospace;background:#f3f5fa;border:2px dashed #94a3b8;border-radius:10px;padding:10px;margin:8px 0;word-break:break-all;direction:ltr;text-align:center;user-select:all;color:#1f2430}
.gl-adm{border-top:2px solid #e6eaf2;margin-top:12px;padding-top:6px}
</style>

<body>
<div id="app">
  <header class="top" id="top">
    <a class="brand" href="./" aria-label="Game Lab"><span>🚀</span><span data-t="title">אתגר הניאון</span></a>
    <div class="icons">
      <button class="ib" id="b-sound" aria-label="sound">🔊</button>
      <button class="ib" id="b-lang" aria-label="language">EN</button>
    </div>
  </header>

  <!-- MENU -->
  <section class="screen on" id="s-menu">

      <h1><span data-t="title">אתגר הניאון</span><small>NEON CHALLENGE</small></h1>

      <button class="ib" id="b-wnext" aria-label="next world">▶</button>
