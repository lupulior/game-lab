        var ra = GL.submit(GL.ADMIN); renderMoney(); var adminPill = $('l-coins').textContent; var cBefore = G.coins; var adminBuy = buySkin('hatCrown'); ok('admin code: coin pills show 🪙 ∞, every level is unlocked and the shop never charges', ra && ra.ok && ra.admin && isAdmin() && adminPill === '🪙 ∞' && unlockedLv('classic') === NLV && unlockedLv('bike') === NLV && adminBuy && G.coins === cBefore && G.skin.hat === 'hatCrown', adminPill);
        GL.setAdmin(false); renderMoney(); ok('leaving admin mode restores the real coin count and locks', !isAdmin() && $('l-coins').textContent === '🪙 ' + G.coins && unlockedLv('classic') === G.modes.classic.unlocked);
        var code = GL.makeGift('obby', 500), c0 = G.coins, rg = GL.submit(code), c1g = G.coins, rg2 = GL.submit(code); ok('gift code GL-OBBY-500-… adds 500 coins once; the same code is refused the second time', rg && rg.ok && c1g === c0 + 500 && rg2 && !rg2.ok && G.coins === c1g, JSON.stringify([rg, rg2]));
        ok('a gift code for another game is refused here', !GL.submit(GL.makeGift('mart', 100)).ok);
        GL.setAdmin(false); try { localStorage.removeItem('gl.used'); localStorage.removeItem('gl.plays.obby'); localStorage.removeItem(KEY); } catch(e){}
        ok('public API on window.OB', ['genLevel', 'checkFeasible', 'startRun', 'step', 'runFor', 'autoInput', 'autoDrive', 'stepPlayer', 'stepVehicle', 'koBot', 'bumpAll', 'save', 'load', 'setLang', 'prepDemo', 'render', 'state', 'G', 'CAM'].every(function(k){ return k in I; }));
        ok('no runtime errors', errs.filter(function(x){ return x.indexOf('onerror') === 0 || x.indexOf('init') === 0 || x.indexOf('GL.mount') === 0; }).length === 0, errs.join(' | '));
      } catch(e){ errs.push('exception: ' + (e && e.stack || e)); }
      done();
    })();
  })();
}
})();
</script>
