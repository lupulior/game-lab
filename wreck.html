<style>
:root{ --bg:#4C8FE0; --bg2:#2F6BC2; --text:#FFFFFF; --muted:#DCEBFF; --gold:#FFD23F; --orange:#FF8A2B; --green:#5BD36A; --card:rgba(255,255,255,.12); --line:rgba(255,255,255,.28); --dark:#1B2A4E; --font:"Varela Round","Arial Rounded MT Bold",Arial,Helvetica,sans-serif }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg)}
body{font-family:var(--font);color:var(--text);font-size:18px;line-height:1.35;overflow-x:hidden;-webkit-font-smoothing:antialiased;touch-action:manipulation;background:linear-gradient(180deg,#5FA0EC 0%,#4C8FE0 45%,#BFE2F7 100%);background-attachment:fixed}
body.ingame{overflow:hidden;background:#000}
#app{position:relative;max-width:660px;margin:0 auto;padding:10px 12px 20px}
body.ingame #app{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 0 8px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);font-weight:900;font-size:19px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.icons{display:flex;gap:8px}
.ib{min-width:44px;min-height:44px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:900 17px/1 var(--font);cursor:pointer;padding:0 10px}
.ib:active{transform:translateY(1px);opacity:.85}
.screen{display:none}.screen.on{display:block}
.hero{text-align:center;padding:4px 0 2px}
.hero h1{margin:0;font-size:40px;letter-spacing:1px;text-shadow:0 3px 0 #1B2A4E,0 6px 18px rgba(0,0,0,.3)}
.hero h1 small{display:block;font-size:18px;color:var(--gold);font-weight:900;margin-top:2px;letter-spacing:3px;text-shadow:0 2px 0 #1B2A4E}
.hero .tag{margin:8px 0 10px;color:var(--muted);font-size:17px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.stats{display:flex;justify-content:center;gap:10px;font-size:19px;font-weight:900;margin:0 0 12px;flex-wrap:wrap}
.stats span{background:var(--dark);border:2px solid var(--line);border-radius:999px;padding:6px 16px;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.btn{display:block;width:100%;min-height:56px;border:0;border-radius:18px;background:var(--orange);color:#fff;font:900 22px var(--font);cursor:pointer;margin:10px 0;box-shadow:0 6px 0 #C45F10,0 10px 18px rgba(0,0,0,.25);text-shadow:0 1px 0 rgba(0,0,0,.3)}

.btn.blue{background:#2F6BC2;box-shadow:0 6px 0 #1B4480,0 10px 18px rgba(0,0,0,.25)}.btn.blue:active{box-shadow:0 2px 0 #1B4480}
.btn.green{background:#3FB950;box-shadow:0 6px 0 #237A2E,0 10px 18px rgba(0,0,0,.25)}.btn.green:active{box-shadow:0 2px 0 #237A2E}
.btn.ghost{background:var(--card);border:2px solid var(--line);box-shadow:none;min-height:50px;font-size:19px}
.btn.ghost:active{transform:translateY(2px)}
.btn small{display:block;font-size:16px;font-weight:700;opacity:.9}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sel{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px}
.sel .name{text-align:center;flex:1;font-weight:900;font-size:21px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.sel .name small{display:block;font-size:16px;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{position:relative;min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--text);font:900 20px var(--font);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.tile small{font-size:16px;color:var(--gold);line-height:1;letter-spacing:-1px}
.tile.lock{opacity:.45;cursor:default}
.tile.cur{background:var(--orange);border-color:#fff}
.tile:not(.lock):active{transform:translateY(2px)}
.how{color:var(--muted);font-size:17px;margin:12px 0 4px;text-align:center;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.kbd{text-align:center;color:var(--muted);font-size:16px;margin:4px 0}
.kbd b{display:inline-block;background:var(--dark);border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin:2px;font-size:16px;color:#fff}
footer{text-align:center;padding:14px 0 0;color:var(--muted);font-size:16px}

.shop{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 10px}
.item .ic{font-size:34px;line-height:1;width:44px;text-align:center}
.item .nm{flex:1;font-weight:900;font-size:18px}

.item .buy{min-width:96px;min-height:44px;border:0;border-radius:12px;background:var(--green);color:#143;font:900 17px var(--font);cursor:pointer;box-shadow:0 4px 0 #237A2E}

.item .buy:active:not(:disabled){transform:translateY(3px);box-shadow:none}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin:8px 0;min-height:56px;font-weight:900;font-size:18px}
.set input[type=range]{width:46%;min-height:44px}
.set .ib{min-width:72px}
.hidden{display:none !important}
#test-log{white-space:pre-wrap;font-family:monospace;font-size:12px;color:#fff;background:#000;padding:8px;direction:ltr}
#nogl{background:var(--dark);border:2px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;text-align:center;font-weight:900;font-size:18px}
/* ---------- game ---------- */
#s-game{position:fixed;inset:0;display:none;background:#9ED0F0;overflow:hidden;user-select:none;-webkit-user-select:none}
#s-game.on{display:block}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#hud{position:absolute;inset:0;pointer-events:none;font-family:var(--font);z-index:3}
#hud .tl{position:absolute;top:10px;left:10px;display:flex;gap:8px;align-items:center;pointer-events:auto;direction:ltr}
#hud .tr{position:absolute;top:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:auto;direction:ltr}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;background:rgba(27,42,78,.82);color:#fff;font:900 19px var(--font);border:2px solid rgba(255,255,255,.35);white-space:nowrap}
.pill.money{color:var(--gold)}
#hud .ib{background:rgba(27,42,78,.82);border-color:rgba(255,255,255,.35);font-size:20px}
#obj{position:absolute;left:0;top:0;transform:translate(-50%,-50%);pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;transition:none}
#obj .dia{width:22px;height:22px;background:var(--orange);border:3px solid #fff;transform:rotate(45deg);box-shadow:0 2px 8px rgba(0,0,0,.4)}
#obj .arrow{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:14px solid var(--orange);display:none}
#obj.edge .arrow{display:block}
#obj span{background:rgba(27,42,78,.85);border:2px solid var(--orange);color:#fff;font:900 16px var(--font);padding:4px 10px;border-radius:999px;white-space:nowrap}
#xh{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}
#xh:before,#xh:after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#xh:before{left:9px;top:0;width:4px;height:22px}#xh:after{top:9px;left:0;width:22px;height:4px}
#hotbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto;direction:ltr;max-width:100%;padding:0 6px}
.slot{position:relative;width:52px;height:52px;border-radius:12px;background:rgba(27,42,78,.78);border:2px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:27px;cursor:pointer;color:#fff;padding:0;flex:0 0 auto}
.slot.sel{border-color:var(--gold);background:rgba(255,138,43,.85);transform:translateY(-6px);box-shadow:0 0 0 2px #fff,0 4px 10px rgba(0,0,0,.35)}
.slot.none{opacity:.5}
.slot b{position:absolute;right:2px;bottom:0;font:900 16px/1 var(--font);color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.slot i{position:absolute;left:4px;top:1px;font:700 16px/1 var(--font);color:rgba(255,255,255,.75);font-style:normal}
#hint{position:absolute;left:12px;bottom:80px;max-width:46%;color:#fff;font:700 16px/1.7 var(--font);text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.6);direction:ltr;text-align:left;pointer-events:none}
#hint b{display:inline-block;background:rgba(27,42,78,.8);border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:0 6px;margin:0 2px;font-size:16px}
#click{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);background:rgba(27,42,78,.85);border:2px solid #fff;border-radius:16px;padding:12px 18px;font:900 19px var(--font);color:#fff;pointer-events:none;display:none;text-align:center}
#click.on{display:block}
#toast2{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:rgba(27,42,78,.9);border:2px solid var(--gold);color:#fff;font:900 19px var(--font);padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast2.on{opacity:1}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
/* touch */
#touch{position:absolute;inset:0;pointer-events:none;display:none;z-index:2}
#touch.on{display:block}
#joy{position:absolute;left:18px;bottom:84px;width:132px;height:132px;border-radius:50%;background:rgba(27,42,78,.45);border:2px solid rgba(255,255,255,.4);pointer-events:auto;touch-action:none}
#joy .k{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.4)}
#look{position:absolute;left:35%;top:0;right:0;bottom:0;pointer-events:auto;touch-action:none}
.tb{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(27,42,78,.72);border:2px solid rgba(255,255,255,.5);color:#fff;font:900 26px var(--font);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0}
.tb.on{background:rgba(255,138,43,.9)}
#b-jump{right:18px;bottom:160px}#b-use{right:96px;bottom:100px;width:84px;height:84px;font-size:34px}#b-run{right:18px;bottom:84px}
/* overlay */
#ov{position:absolute;inset:0;background:rgba(10,20,40,.62);display:none;align-items:center;justify-content:center;padding:10px;z-index:5}
#ov.on{display:flex}
.panel{width:100%;max-width:440px;max-height:96vh;overflow:auto;background:#2F6BC2;border:3px solid #fff;border-radius:22px;padding:14px 16px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.panel h2{margin:4px 0 6px;font-size:28px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.panel .big{font-size:40px;letter-spacing:2px;margin:2px 0}
.panel p{margin:6px 0;font-size:18px}
.panel .btn{margin:8px 0}
.panel .shop{text-align:start;margin:6px 0}
.panel .set{text-align:start}
@media (max-width:420px){ .hero h1{font-size:34px} .grid{gap:6px} .tile{min-height:54px;font-size:18px} .pill{font-size:16px;padding:0 10px} #hud .ib{min-width:44px} }

@media (max-width:520px){ #hud .tr{flex-direction:column;align-items:flex-end;gap:6px} #s-game.touch #hotbar{bottom:132px} #joy{left:12px;bottom:12px;width:110px;height:110px} #joy .k{left:30px;top:30px} #b-run{right:12px;bottom:12px} #b-jump{right:84px;bottom:12px} #b-use{right:156px;bottom:12px;width:64px;height:64px;font-size:28px} }

</style>

        $('p-next').click(); ok('"next level" starts level 2 with its name toast', G.level === 2 && G.S.L.n === 2 && !$('ov').classList.contains('on'));
        /* --- rendering (skipped without a GL context) --- */
        if (gl){ I.meshDirty(G.S.W, 64); I.render(G.S, 1000); var nz = R.chunks.filter(function(c){ return c.n > 0; }).length;
          ok('GL: chunk meshes built (' + nz + ' non-empty of 32), ≤ 150 draws, no GL error after a frame', nz >= 8 && R.draws <= 150 && gl.getError() === 0, gl.getError());
          var px = new Uint8Array(4); try { gl.readPixels(Math.floor(R.w / 2), R.h - 3, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); } catch(e){}
          ok('GL: the top of the frame is sky blue (b > r)', px[2] > px[0] && px[2] > 150, JSON.stringify([].slice.call(px)));
          var pr = I.project(G.S.p.x, G.S.p.y + EYE, G.S.p.z + 5); ok('project(): a point 5 m ahead lands near the screen centre', !pr.behind && Math.abs(pr.x - $('gl').clientWidth / 2) < 4 && Math.abs(pr.y - $('gl').clientHeight / 2) < 40, JSON.stringify(pr));
          G.S.W.set(5, 9, 5, M.BRICK); var dirty0 = G.S.W.dirty[0]; I.meshDirty(G.S.W, 64); ok('editing a voxel marks its chunk dirty and only dirty chunks are re-meshed', dirty0 === 1 && G.S.W.dirty[0] === 0);
        } else { ok('GL: skipped (no WebGL context in this environment)', true); ok('GL: skipped', true); ok('GL: skipped', true); ok('GL: skipped', true); }
        /* --- layout --- */
        I.show('s-menu');
        ok('no horizontal overflow', document.documentElement.scrollWidth <= window.innerWidth + 1, document.documentElement.scrollWidth + '>' + window.innerWidth);
        var wide = []; [].slice.call(document.querySelectorAll('#app *')).forEach(function(e){ var rc = e.getBoundingClientRect(); if (rc.width > 0 && (rc.right > window.innerWidth + 1 || rc.left < -1)) wide.push((e.id || e.className || e.tagName) + ':' + Math.round(rc.left) + '-' + Math.round(rc.right)); });
        ok('no element sticks out of the viewport (' + window.innerWidth + 'px)', wide.length === 0, wide.slice(0, 8).join(' | '));
        var small = []; [].slice.call(document.querySelectorAll('#app button, #app p, #app small, #app b, #app span, #app a')).forEach(function(e){ if (!e.offsetParent) return; var fs = parseFloat(getComputedStyle(e).fontSize); if (fs < 16 && e.textContent.trim()) small.push((e.id || e.className || e.tagName) + ':' + fs); });
        ok('all visible menu text ≥ 16 px', small.length === 0, small.slice(0, 8).join(' | '));
        ok('menu buttons ≥ 44 px tall', [].slice.call(document.querySelectorAll('#s-menu button')).every(function(b){ return b.getBoundingClientRect().height >= 44; }));
        ok('pwa install snippet present and hidden', !!$('pwa-install') && getComputedStyle($('pwa-install')).display === 'none');
        ok('footer links to the games menu', !!document.querySelector('footer a[href="./"]'));
        ok('JSON-LD VideoGame present; manifest + apple-touch-icon linked; theme colour #4C8FE0', (function(){ try { return JSON.parse(document.querySelector('script[type="application/ld+json"]').textContent)['@type'] === 'VideoGame'; } catch(e){ return false; } })() && !!document.querySelector('link[rel="manifest"][href="wreck.webmanifest"]') && !!document.querySelector('link[rel="apple-touch-icon"][href="art/wreck-180.png"]') && document.querySelector('meta[name="theme-color"]').content.toUpperCase() === '#4C8FE0');
        ok('public API on window.VW', ['genLevel', 'World', 'TOOLS', 'MATERIALS', 'useTool', 'autoPlay', 'simulate', 'show', 'start', 'setLang', 'newSim', 'step', 'explodeAt', 'planTo'].every(function(k){ return k in I; }));
        ok('file budget: inline script < 400 KB', document.documentElement.outerHTML.length < 400 * 1024, document.documentElement.outerHTML.length);
        try { localStorage.removeItem(KEY); } catch(e){}
        ok('no runtime errors', errs.filter(function(x){ return x.indexOf('onerror') === 0 || x.indexOf('init') === 0; }).length === 0);
      } catch(e){ errs.push('exception: ' + (e && e.stack || e)); }
      done();
    })();
  })();
}
})();
