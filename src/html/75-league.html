<!-- ===== 75-league: the monthly league modal (from the home pill) and the end-of-season prize modal ===== -->
<div class="overlay" id="league-modal">
  <div class="panel lg-panel">
    <h2 id="lg-title">🏅 הליגה החודשית</h2>
    <div class="lg-hero"><span class="lg-icon lg-0" id="lg-icon">🥉</span><div class="lg-hero-txt"><div class="lg-name" id="lg-name"></div><div class="lg-trline" id="lg-tr"></div></div></div>
    <div class="lg-bar lg-0" id="lg-bar"><i></i></div>
    <div class="lg-next" id="lg-next"></div>
    <div class="lg-days" id="lg-days"></div>
    <div class="lg-how" id="lg-how"></div>
    <div class="lg-prizes-h" id="lg-prizes-h">🎁 פרסים בסוף החודש</div>
    <div class="lg-table" id="lg-table"></div>
    <div class="lg-btns"><button class="btn purple small" id="btn-lg-board">🏅 הטבלה</button> <button class="btn small blue" id="btn-lg-close">סגור</button></div>
  </div>
</div>
<div class="overlay" id="league-prize-modal">
  <div class="panel lgp-panel">
    <h2 id="lgp-title">🏆 העונה הסתיימה!</h2>
    <div class="lgp-icon lg-1" id="lgp-icon">🥈</div>
    <div class="lgp-sub" id="lgp-sub"></div>
    <div class="lgp-list" id="lgp-list"></div>
    <button class="btn green big" id="btn-lg-take">קבל! 🎉</button>
    <div class="lgp-new" id="lgp-new"></div>
  </div>
</div>
