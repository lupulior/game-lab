<!-- ===== SHOP: daily rotation, players, locker (looks), gems, powers ===== -->
  <section id="shop" class="screen">
    <div class="shop-lawn"></div>
    <h2 id="shop-title">🛒 החנות</h2>
    <button class="btn blue small" id="shop-back">➜ חזרה</button>
    <div class="shop-wallet"><span class="shop-pill coins" id="shop-coins">🪙 0</span><span class="shop-pill gems" id="shop-gems">💎 0</span></div>
    <div class="shop-tabs" id="shop-tabs">
      <button class="shop-tab" data-tab="today"><i>📅</i><span id="shop-tab-today">היום</span></button>
      <button class="shop-tab" data-tab="players"><i>🧑</i><span id="shop-tab-players">שחקנים</span></button>
      <button class="shop-tab" data-tab="looks"><i>👕</i><span id="shop-tab-looks">מראה</span></button>
      <button class="shop-tab" data-tab="gems"><i>💎</i><span id="shop-tab-gems">יהלומים</span></button>
      <button class="shop-tab" data-tab="powers"><i>⚡</i><span id="shop-tab-powers">כוחות</span></button>
    </div>
    <div class="shop-body" id="shop-body"></div>
  </section>
