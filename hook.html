        G.classicLevel = 1; G.grappleLevel = 1; G.coins = 100; G.streak = 0; G.auto = true; for (i = 0; i < HZ * 40 && !G.S.over; i++) I.tick(I.DT); G.auto = false;
        ok('finishing level 1 (auto-player): "שלב 1 ✔" panel, +5 coins (a death happened → not flawless), level 2 unlocked, skin progress bar shown', G.S.won && $('ov').classList.contains('on') && $('panel').textContent.indexOf('שלב 1 ✔') >= 0 && G.coins === 105 && G.classicLevel === 2 && !!$('p-next') && !!$('skp-bar') && $('panel').textContent.indexOf('1/3') > 0, G.coins);
        ok('level-complete buttons ≥ 44 px, inside the viewport', [].slice.call(document.querySelectorAll('#panel button')).every(function(b){ var rc = b.getBoundingClientRect(); return rc.height >= 44 && rc.width >= 44 && rc.right <= window.innerWidth + 1 && rc.bottom <= window.innerHeight + 1; }));
        $('p-next').click(); ok('"next" starts level 2 (fresh run, panel closed)', G.level === 2 && G.S.L.n === 2 && !$('ov').classList.contains('on') && G.S.x === 0);
        G.auto = true; for (i = 0; i < HZ * 40 && !G.S.over; i++) I.tick(I.DT); G.auto = false;
        ok('flawless level 2 (first try, no deaths): +10 coins, streak 2, classicLevel 3', G.S.won && G.coins === 115 && G.streak === 2 && G.classicLevel === 3, G.coins + '/' + G.streak);
        G.classicLevel = 31; I.start('grapple', 1); ok('grapple mode: separate progress, run in grapple mode, HUD label', G.mode === 'grapple' && G.S.mode === 'grapple' && G.grappleLevel === 1);
        G.auto = true; for (i = 0; i < HZ * 40 && !G.S.over; i++) I.tick(I.DT); G.auto = false; ok('grapple level 1 finished by the auto-player → grappleLevel 2, classicLevel untouched', G.S.won && G.grappleLevel === 2 && G.classicLevel === 31);
        /* --- layout --- */
        I.show('s-menu');
        ok('no horizontal overflow', document.documentElement.scrollWidth <= window.innerWidth + 1, document.documentElement.scrollWidth + '>' + window.innerWidth);
        var wide = []; [].slice.call(document.querySelectorAll('#app *')).forEach(function(e){ if (e.closest('#skin-row')) return; var rc = e.getBoundingClientRect(); if (rc.width > 0 && (rc.right > window.innerWidth + 1 || rc.left < -1)) wide.push((e.id || e.className || e.tagName) + ':' + Math.round(rc.left) + '-' + Math.round(rc.right)); });
        ok('no element sticks out of the viewport (' + window.innerWidth + 'px)', wide.length === 0, wide.slice(0, 8).join(' | '));
        var small = []; [].slice.call(document.querySelectorAll('#app button, #app p, #app small, #app b, #app span, #app a, #hud .tx, #hud .ib')).forEach(function(e){ if (!e.offsetParent && e.id !== 'hud-l') return; var fs = parseFloat(getComputedStyle(e).fontSize); if (fs < 16 && e.textContent.trim()) small.push((e.id || e.className || e.tagName) + ':' + fs); });
        ok('all visible text ≥ 16 px', small.length === 0, small.slice(0, 8).join(' | '));
        ok('menu buttons ≥ 44 px tall', [].slice.call(document.querySelectorAll('#s-menu button')).every(function(b){ return b.getBoundingClientRect().height >= 44; }));
        ok('pwa install snippet present and hidden', !!$('pwa-install') && getComputedStyle($('pwa-install')).display === 'none');
        ok('footer links to the games menu', !!document.querySelector('footer a[href="./"]'));
        ok('JSON-LD VideoGame present; manifest + apple-touch-icon + canonical linked', (function(){ try { return JSON.parse(document.querySelector('script[type="application/ld+json"]').textContent)['@type'] === 'VideoGame'; } catch(e){ return false; } })() && !!document.querySelector('link[rel="manifest"][href="hook.webmanifest"]') && !!document.querySelector('link[rel="apple-touch-icon"][href="art/hook-180.png"]') && !!document.querySelector('link[rel="canonical"][href="https://lupulior.github.io/game-lab/hook.html"]'));
        ok('public API on window.HK', ['genLevel', 'newRun', 'step', 'autoInput', 'simulate', 'SKINS', 'show', 'start', 'setLang'].every(function(k){ return k in I; }));
        try { localStorage.removeItem(KEY); } catch(e){}
        ok('no runtime errors', errs.filter(function(x){ return x.indexOf('onerror') === 0 || x.indexOf('init') === 0; }).length === 0);
      } catch(e){ errs.push('exception: ' + (e && e.stack || e)); }
      done();
    })();
  })();
}
