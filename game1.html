<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Football Star ⚽</title>
<style>
:root{
  --sky:#7ED3FF; --sky2:#E3F7FF; --grass:#4CC76A; --grass2:#3FB35B;
  --navy:#1B2A4E; --yellow:#FFD447; --orange:#FF7A3D; --blue:#3D8BFF; --green:#3FC35F;
  --red:#F04E4E; --purple:#8E5CF6; --pink:#FF5FA2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:linear-gradient(#3FB2F5,#A9E4FF);
  font-family:"Varela Round","Arial Rounded MT Bold","Heebo","Rubik",Arial,sans-serif;color:var(--navy);user-select:none;-webkit-user-select:none}

#stage{position:absolute;left:calc(50% - 500px);top:calc(50% - 310px);width:1000px;height:620px;
  transform-origin:center center;overflow:hidden;border-radius:26px;
  background:linear-gradient(var(--sky),var(--sky2) 75%);box-shadow:0 24px 70px rgba(0,40,90,.35)}

.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}

/* ---------- typography ---------- */
.title{font-size:58px;font-weight:900;color:var(--yellow);line-height:1;
  -webkit-text-stroke:2px var(--navy);text-shadow:0 6px 0 var(--navy),0 12px 22px rgba(0,0,0,.28)}
.title small{display:block;font-size:20px;color:#fff;-webkit-text-stroke:1px var(--navy);text-shadow:0 3px 0 var(--navy);margin-top:10px}
h2{font-size:40px;font-weight:900;color:#fff;-webkit-text-stroke:1.5px var(--navy);text-shadow:0 5px 0 var(--navy)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;border:0;cursor:pointer;font-family:inherit;
  font-weight:900;color:#fff;border-radius:24px;padding:14px 36px;font-size:30px;background:var(--orange);
  box-shadow:0 8px 0 #C2521F,0 14px 20px rgba(0,0,0,.22);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(0,0,0,.3);white-space:nowrap}
.btn:active,.btn.pressed{transform:translateY(6px);box-shadow:0 2px 0 #C2521F,0 4px 8px rgba(0,0,0,.2)}
.btn:focus-visible{outline:5px solid #fff;outline-offset:3px}
.btn.blue{background:var(--blue);box-shadow:0 8px 0 #1F5BC2,0 14px 20px rgba(0,0,0,.22)}
.btn.blue:active{box-shadow:0 2px 0 #1F5BC2}
.btn.green{background:var(--green);box-shadow:0 8px 0 #22883C,0 14px 20px rgba(0,0,0,.22)}
.btn.green:active{box-shadow:0 2px 0 #22883C}
.btn.yellow{background:var(--yellow);color:var(--navy);text-shadow:none;box-shadow:0 8px 0 #C99A10,0 14px 20px rgba(0,0,0,.22)}
.btn.yellow:active{box-shadow:0 2px 0 #C99A10}
.btn.red{background:var(--red);box-shadow:0 8px 0 #A82C2C,0 14px 20px rgba(0,0,0,.22)}
.btn.red:active{box-shadow:0 2px 0 #A82C2C}
.btn.purple{background:var(--purple);box-shadow:0 8px 0 #5B34B5,0 14px 20px rgba(0,0,0,.22)}
.btn.purple:active{box-shadow:0 2px 0 #5B34B5}
.btn.pink{background:var(--pink);box-shadow:0 8px 0 #B7326B,0 14px 20px rgba(0,0,0,.22)}
.btn.pink:active{box-shadow:0 2px 0 #B7326B}
.btn.small{font-size:22px;padding:10px 24px;border-radius:18px}
.btn.play{font-size:66px;padding:18px 70px 22px;border-radius:44px}

/* ---------- home ---------- */
#home .title{position:absolute;top:26px;right:40px}
#home .side{position:absolute;top:128px;right:40px;display:flex;flex-direction:column;gap:18px;align-items:flex-end}
#home .side .btn{min-width:210px}
#btn-play{position:absolute;bottom:34px;left:40px}
.sun{position:absolute;top:26px;left:40px;width:110px;height:110px;border-radius:50%;background:var(--yellow);
  box-shadow:0 0 0 14px rgba(255,212,71,.35),0 0 0 30px rgba(255,212,71,.15)}
.cloud{position:absolute;width:140px;height:44px;background:#fff;border-radius:40px;opacity:.95}
.cloud::before{content:"";position:absolute;left:24px;top:-26px;width:60px;height:60px;background:#fff;border-radius:50%}
.cloud::after{content:"";position:absolute;left:66px;top:-16px;width:46px;height:46px;background:#fff;border-radius:50%}
.home-grass{position:absolute;left:0;right:0;bottom:0;height:120px;
  background:repeating-linear-gradient(90deg,var(--grass) 0 80px,var(--grass2) 80px 160px)}
.hero{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:320px;text-align:center}
.hero .sprite{width:320px;height:480px;margin:0 auto;animation:bob 2.4s ease-in-out infinite}
.hero .shadow{width:200px;height:26px;margin:-18px auto 0;border-radius:50%;background:rgba(0,0,0,.22)}
.hero .name{margin-top:6px;font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:1.5px var(--navy);text-shadow:0 4px 0 var(--navy)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.hero .sprite{animation:none}}

/* ---------- characters ---------- */
#chars h2{position:absolute;top:26px;right:40px}
#btn-back{position:absolute;top:26px;left:34px}
.gallery{position:absolute;left:34px;top:100px;width:230px;height:490px;overflow-y:auto;overflow-x:hidden;padding:8px;
  background:rgba(255,255,255,.35);border-radius:22px;scrollbar-width:thin}
.gallery::-webkit-scrollbar{width:8px}.gallery::-webkit-scrollbar-thumb{background:rgba(27,42,78,.4);border-radius:8px}
.card{width:196px;height:196px;margin:0 auto 12px;border-radius:20px;background:#fff;border:6px solid #fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(27,42,78,.25);transition:transform .1s}
.card:hover{transform:scale(1.03)}
.card:focus-visible{outline:5px solid var(--blue);outline-offset:2px}
.card .sprite{width:84px;height:126px}
.card .name{font-size:22px;font-weight:900}
.card.selected{border-color:var(--yellow);background:#FFF6CF}
.preview{position:absolute;right:120px;top:84px;width:440px;text-align:center}
.preview .sprite{width:260px;height:390px;margin:0 auto}
.preview .shadow{width:180px;height:24px;margin:-16px auto 8px;border-radius:50%;background:rgba(0,0,0,.22)}
.preview .name{font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:1.5px var(--navy);text-shadow:0 4px 0 var(--navy);margin-bottom:12px}

/* ---------- CEO ---------- */
#ceo{background:radial-gradient(ellipse at 50% 42%,#4a3a9a 0%,#1B2A4E 55%,#0b1230 100%)}
#ceo .rays{position:absolute;left:50%;top:50%;width:1500px;height:1500px;transform:translate(-50%,-50%);border-radius:50%;
  background:repeating-conic-gradient(rgba(255,212,71,.16) 0 8deg,transparent 8deg 16deg);animation:spin 50s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.ceo-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.ceo-cup{font-size:118px;line-height:1.1;animation:cupbounce 1.6s ease-in-out infinite;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5))}
@keyframes cupbounce{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-16px) rotate(7deg)}}
.gold{font-weight:900;line-height:1.15;padding:0 20px;
  background:linear-gradient(100deg,#8a5a00 0%,#ffd447 22%,#fff7c2 42%,#ffd447 52%,#c98a00 72%,#ffe27a 100%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:shimmer 3s linear infinite;filter:drop-shadow(0 5px 0 #5a3a00) drop-shadow(0 14px 22px rgba(0,0,0,.55))}
@keyframes shimmer{to{background-position:-200% 0}}
.ceo-name{font-size:120px;letter-spacing:2px}
.ceo-role{font-size:62px;margin-top:-8px}
.ceo-tag{margin-top:22px;font-size:26px;font-weight:900;color:#fff;background:rgba(255,255,255,.12);border:3px solid rgba(255,212,71,.7);
  padding:8px 28px;border-radius:30px;box-shadow:0 0 24px rgba(255,212,71,.35)}
.spark{position:absolute;font-size:36px;animation:twinkle 1.6s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.5) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(25deg)}}
#ceo-confetti{position:absolute;inset:0;width:1000px;height:620px;pointer-events:none;z-index:3}
#btn-ceo-back{position:absolute;top:26px;left:34px;z-index:4}
@media (prefers-reduced-motion:reduce){#ceo .rays,.ceo-cup,.gold,.spark{animation:none}}

/* ---------- game ---------- */
#fans{position:absolute;left:0;top:0;width:1000px;height:78px}
#fans svg{width:100%;height:100%;display:block}
#fans .arms-up{display:none}
#fans.cheer .arms-up{display:block}
#fans.cheer .arms-down{display:none}
#fans.cheer .fan{animation:fanjump .28s infinite alternate}
@keyframes fanjump{to{transform:translateY(-9px)}}

#pitch,#front{position:absolute;left:0;top:0;width:1000px;height:620px;pointer-events:none}
#pitch svg,#front svg{width:100%;height:100%;display:block}
.pshadow{position:absolute;left:0;top:0;width:64px;height:14px;border-radius:50%;background:rgba(0,0,0,.28);will-change:transform}

.player{position:absolute;left:0;top:0;width:72px;height:108px;will-change:transform}
.player .sprite{width:100%;height:100%}
.player .sprite.flip{transform:scaleX(-1)}
.num{transform-box:fill-box;transform-origin:center}
.player .sprite.flip .num{transform:scaleX(-1)}
.leg{transform-box:fill-box;transform-origin:50% 0%}
.player.running .leg-front{animation:legF .26s infinite alternate ease-in-out}
.player.running .leg-back{animation:legB .26s infinite alternate ease-in-out}
@keyframes legF{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes legB{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
.player.kicking .leg-front{animation:kickA .3s ease-out}
@keyframes kickA{0%{transform:rotate(35deg)}50%{transform:rotate(-75deg)}100%{transform:rotate(0)}}
.player .tag{position:absolute;left:50%;top:-28px;transform:translateX(-50%);font-size:18px;font-weight:900;color:#fff;
  background:var(--navy);padding:2px 12px;border-radius:14px;white-space:nowrap}
.player.me .tag{background:var(--blue)}
#ball{position:absolute;left:0;top:0;width:26px;height:26px;will-change:transform}
#ball svg{width:100%;height:100%;display:block}

#timer{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:34px;font-weight:900;color:#fff;background:var(--navy);
  padding:4px 22px;border-radius:18px;direction:ltr;letter-spacing:1px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#timer.urgent{background:var(--red);animation:blink .6s infinite alternate}
@keyframes blink{to{transform:translateX(-50%) scale(1.08)}}
#scoreboard{position:absolute;top:10px;right:16px;background:#fff;border-radius:18px;padding:4px 16px 6px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.35)}
#scoreboard .score{font-size:34px;font-weight:900;direction:ltr;display:flex;justify-content:center;gap:10px;line-height:1}
#scoreboard .score .me{color:var(--blue)}#scoreboard .score .op{color:var(--red)}
#scoreboard .names{font-size:15px;font-weight:900;direction:ltr;display:flex;justify-content:center;gap:6px}
#scoreboard .names .me{color:var(--blue)}#scoreboard .names .op{color:var(--red)}
#level-tag{position:absolute;top:14px;left:16px;font-size:18px;font-weight:900;color:#fff;background:var(--purple);padding:4px 14px;border-radius:14px}

#confetti{position:absolute;inset:0;width:1000px;height:620px;pointer-events:none}
#goal-flash{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(0);font-size:120px;font-weight:900;color:var(--yellow);
  -webkit-text-stroke:3px var(--navy);text-shadow:0 10px 0 var(--navy);pointer-events:none;white-space:nowrap}
#goal-flash.show{animation:pop 1.8s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(0) rotate(-10deg)}20%{transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}35%{transform:translate(-50%,-50%) scale(1) rotate(0)}85%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}

.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(27,42,78,.55)}
.overlay.show{display:flex}
.panel{background:#fff;border-radius:34px;padding:30px 44px;text-align:center;box-shadow:0 16px 0 rgba(0,0,0,.25);max-width:760px}
.panel h2{color:var(--navy);-webkit-text-stroke:0;text-shadow:none;margin-bottom:16px}
.panel .levels{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:18px}
.panel .hint{font-size:20px;font-weight:700;color:#5b6a8a;line-height:1.6}
.panel kbd{display:inline-block;background:var(--navy);color:#fff;border-radius:8px;padding:2px 10px;font-family:inherit;font-size:18px;margin:0 3px;direction:ltr}
#end .panel h2{font-size:80px;line-height:1.1;margin-bottom:6px}
#end .sub{font-size:26px;font-weight:900;color:#5b6a8a}
#exit-modal .sprite{width:180px;height:270px;margin:0 auto 10px}

#touch{position:absolute;left:0;right:0;bottom:0;display:none;justify-content:space-between;padding:0 24px 24px;pointer-events:none}
#touch .grp{display:flex;gap:14px;pointer-events:auto}
#touch .btn{font-size:36px;padding:6px 26px;border-radius:50px;opacity:.9}
body.touch #touch{display:flex}
</style>
</head>
<body>
<div id="stage">

  <!-- ===== HOME ===== -->
  <section id="home" class="screen active">
    <div class="sun"></div>
    <div class="cloud" style="left:200px;top:110px"></div>
    <div class="cloud" style="left:620px;top:60px;transform:scale(.8)"></div>
    <div class="home-grass"></div>
    <div class="title">⚽ Football Star<small>כוכב הכדורגל</small></div>
    <div class="side">
      <button class="btn blue" id="btn-chars">🧑 דמויות</button>
      <button class="btn red" id="btn-exit">🚪 צא</button>
      <button class="btn purple" id="btn-ceo">👔 מנכ"ל המשחק</button>
    </div>
    <div class="hero">
      <div class="sprite" id="home-sprite"></div>
      <div class="shadow"></div>
      <div class="name" id="home-name"></div>
    </div>
    <button class="btn green play" id="btn-play">שחק ▶</button>
  </section>

  <!-- ===== CHARACTERS ===== -->
  <section id="chars" class="screen">
    <h2>בחרו דמות</h2>
    <button class="btn blue small" id="btn-back">➜ חזרה</button>
    <div class="gallery" id="gallery"></div>
    <div class="preview">
      <div class="sprite" id="preview-sprite"></div>
      <div class="shadow"></div>
      <div class="name" id="preview-name"></div>
      <button class="btn yellow" id="btn-choose">✔ בחר</button>
    </div>
  </section>

  <!-- ===== CEO ===== -->
  <section id="ceo" class="screen">
    <div class="rays"></div>
    <span class="spark" style="left:120px;top:90px">✨</span>
    <span class="spark" style="left:860px;top:120px;animation-delay:.4s">✨</span>
    <span class="spark" style="left:170px;top:470px;animation-delay:.8s">⭐</span>
    <span class="spark" style="left:800px;top:500px;animation-delay:1.2s">✨</span>
    <span class="spark" style="left:300px;top:40px;animation-delay:.6s">⭐</span>
    <span class="spark" style="left:680px;top:560px;animation-delay:1s">⭐</span>
    <div class="ceo-wrap">
      <div class="ceo-cup">🏆</div>
      <div class="gold ceo-name">ליאור לופו</div>
      <div class="gold ceo-role">יוצר משחקים</div>
      <div class="ceo-tag">👔 מנכ"ל המשחק</div>
    </div>
    <canvas id="ceo-confetti" width="1000" height="620"></canvas>
    <button class="btn blue small" id="btn-ceo-back">➜ חזרה</button>
  </section>

  <!-- ===== GAME ===== -->
  <section id="game" class="screen">
    <div id="fans"></div>
    <div id="pitch"></div>
    <div class="pshadow" id="sh1"></div><div class="pshadow" id="sh2"></div><div class="pshadow" id="shb"></div>
    <div class="player me" id="p1"><div class="tag">אני</div><div class="sprite"></div></div>
    <div class="player" id="p2"><div class="tag">יריב</div><div class="sprite"></div></div>
    <div id="ball"></div>
    <div id="front"></div>
    <div id="level-tag"></div>
    <div id="timer">4:00</div>
    <div id="scoreboard">
      <div class="score"><span class="me" id="s-me">0</span><span>-</span><span class="op" id="s-op">0</span></div>
      <div class="names"><span class="me" id="n-me"></span><span>|</span><span class="op" id="n-op"></span></div>
    </div>
    <canvas id="confetti" width="1000" height="620"></canvas>
    <div id="goal-flash">גול!!!</div>
    <div id="touch">
      <div class="grp"><button class="btn blue" data-k="left">◀</button><button class="btn blue" data-k="right">▶</button></div>
      <div class="grp"><button class="btn green" data-k="jump">⤒</button><button class="btn orange" data-k="kick">⚽</button></div>
    </div>
    <div class="overlay" id="end"><div class="panel"><h2 id="end-title"></h2><div class="sub" id="end-sub"></div></div></div>
  </section>

  <!-- ===== LEVEL MODAL ===== -->
  <div class="overlay" id="level-modal">
    <div class="panel">
      <h2>באיזו רמה לשחק?</h2>
      <div class="levels" id="levels"></div>
      <div class="hint">
        <kbd>A</kbd> שמאלה &nbsp; <kbd>D</kbd> ימינה &nbsp; <kbd>W</kbd> קפיצה &nbsp; <kbd>רווח</kbd> בעיטה חזקה<br>
        נגיעה בכדור דוחפת אותו. 3 גולים או 4 דקות – ומי שמוביל מנצח!
      </div>
      <br><button class="btn small" id="btn-level-cancel">חזרה</button>
    </div>
  </div>

  <!-- ===== EXIT MODAL ===== -->
  <div class="overlay" id="exit-modal">
    <div class="panel">
      <div class="sprite" id="exit-sprite"></div>
      <h2>אל תצא מהמשחק! 🥺</h2>
      <button class="btn green" id="btn-stay">בסדר, אני נשאר 😄</button>
    </div>
  </div>

</div>

<script>
/* =========================================================
   Football Star – single-file game
   ========================================================= */
'use strict';

/* ---------- characters (cartoon caricatures) ---------- */
const CHARS = [
  { id:'mbappe', name:'אמבפה', skin:'#8D5A3B', skinDark:'#5e3a24', hair:'short', hairColor:'#161616',
    jersey:'#1F4FD8', numColor:'#fff', shorts:'#ffffff', socks:'#E03030', number:10, beard:false, brows:'round' },
  { id:'messi', name:'מסי', skin:'#F1C9A5', skinDark:'#b8865f', hair:'wavy', hairColor:'#6B4423',
    jersey:'#8EC9F0', stripes:'#ffffff', numColor:'#1B2A4E', shorts:'#111111', socks:'#ffffff', number:10, beard:true, beardColor:'#5a3a1e', brows:'round' },
  { id:'ronaldo', name:'רונלדו', skin:'#E8B892', skinDark:'#b07a55', hair:'spiky', hairColor:'#1e1a17',
    jersey:'#C8102E', numColor:'#fff', shorts:'#0B5F3A', socks:'#C8102E', number:7, beard:false, brows:'sharp' },
  { id:'neymar', name:'ניימאר', skin:'#D9A06B', skinDark:'#9c6a3f', hair:'mohawk', hairColor:'#F0D060', hairSide:'#2a1d14', browColor:'#2a1d14',
    jersey:'#FFDC00', numColor:'#009C3B', shorts:'#1A3DA8', socks:'#ffffff', number:10, beard:false, brows:'round' },
  { id:'haaland', name:'הולאנד', skin:'#F3D2B3', skinDark:'#c49a72', hair:'bun', hairColor:'#F2DC8A', browColor:'#c9a84a',
    jersey:'#6CABDD', numColor:'#1C2C5B', shorts:'#ffffff', socks:'#6CABDD', number:9, beard:false, brows:'sharp' },
  { id:'salah', name:'סלאח', skin:'#B9794F', skinDark:'#7d4d2c', hair:'curly', hairColor:'#1d1410',
    jersey:'#C8102E', numColor:'#fff', shorts:'#C8102E', socks:'#C8102E', number:11, beard:true, beardColor:'#1d1410', brows:'round' },
];

function playerSVG(c, mood='happy'){
  let hair='';
  if(c.hair==='short')
    hair=`<path d="M19 40 Q19 8 50 6 Q81 8 81 40 Q70 22 50 22 Q30 22 19 40Z" fill="${c.hairColor}"/>`;
  else if(c.hair==='wavy')
    hair=`<path d="M17 46 Q13 4 50 4 Q87 4 83 46 Q80 26 68 22 Q50 18 32 22 Q20 26 17 46Z" fill="${c.hairColor}"/>
          <path d="M17 40 Q10 56 20 66 Q22 52 24 42Z" fill="${c.hairColor}"/><path d="M83 40 Q90 56 80 66 Q78 52 76 42Z" fill="${c.hairColor}"/>`;
  else if(c.hair==='mohawk')   // shaved dark sides + blond curly crest (Neymar)
    hair=`<path d="M19 40 Q19 14 50 10 Q81 14 81 40 Q70 26 50 26 Q30 26 19 40Z" fill="${c.hairSide}"/>
          <path d="M32 24 Q34 12 42 10 Q46 2 50 4 Q54 2 58 10 Q66 12 68 24 Q60 18 50 18 Q40 18 32 24Z" fill="${c.hairColor}"/>
          <circle cx="36" cy="16" r="6" fill="${c.hairColor}"/><circle cx="43" cy="9" r="6" fill="${c.hairColor}"/><circle cx="50" cy="6" r="6.5" fill="${c.hairColor}"/>

/* ---------- sound (tiny WebAudio) ---------- */
const sfx = (()=>{
  let ctx;
  const get = () => ctx || (ctx = new (window.AudioContext||window.webkitAudioContext)());
  function tone(f,t,type='square',vol=.15,slide){
    try{
      const c=get(); if(c.state==='suspended') c.resume();
      const o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.setValueAtTime(f,c.currentTime);
      if(slide) o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+t);
      g.gain.setValueAtTime(vol,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t);
      o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime+t);
    }catch(e){}
  }
  return {
    click:()=>tone(620,.08,'sine',.1),
    kick:()=>tone(200,.12,'square',.18,50),
    bounce:()=>tone(320,.05,'sine',.07,180),
    whistle:()=>{tone(2300,.25,'sine',.14,2700); setTimeout(()=>tone(2300,.45,'sine',.14,2700),300);},
    goal:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.28,'triangle',.2),i*120)),
    win:()=>[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,.35,'triangle',.2),i*150)),
    lose:()=>[392,349,311,220].forEach((f,i)=>setTimeout(()=>tone(f,.35,'sawtooth',.1),i*200)),
  };
})();

/* ---------- perspective pitch ---------- */
const HOR=-570, PA=1000, ZA=.75, ZB=.5;              // high camera: player line (z=.5) at y=430, far touchline at y=230, near one below the screen
const fz = z => 1/(ZA+ZB*z);                          // perspective scale at depth z (0 near, 1 far); 1 at the player line (z=.5)
const proj = (x,z,h=0) => { const f=fz(z); return [500+(x-500)*f, HOR+PA*f-h*f]; };
const pts = arr => arr.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const ZP=.5, GZ1=ZP-.054, GZ2=ZP+.054;                // goal mouth depth span (7.3m of 68m)

function buildPitch(){
  const line='stroke="#fff" stroke-width="3.5" fill="none" stroke-linejoin="round" opacity=".92"';
  let s='<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg"><defs>'+
    '<pattern id="net" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0H7M0 0V7" stroke="rgba(255,255,255,.75)" stroke-width="1"/></pattern></defs>';
  s+='<rect width="1000" height="620" fill="#3FB35B"/>';
  // mown stripes converging toward the vanishing point
  for(let i=-4;i<14;i++){
    const x0=i*100, x1=x0+100;
    s+=`<polygon points="${pts([proj(x0,.1),proj(x1,.1),proj(x1,1),proj(x0,1)])}" fill="${i%2?'#3FB35B':'#4CC76A'}"/>`;
  }
  // beyond the far touchline: out-of-bounds grass, running track, advertising boards
  const farY=proj(500,1)[1];
  s+=`<rect x="0" y="78" width="1000" height="${farY-78}" fill="#2E8F46"/>`;
  s+='<rect x="0" y="106" width="1000" height="42" fill="#C9694A"/><rect x="0" y="120" width="1000" height="2" fill="rgba(255,255,255,.6)"/><rect x="0" y="134" width="1000" height="2" fill="rgba(255,255,255,.6)"/>';
  const bc=['#F04E4E','#3D8BFF','#FFD447','#8E5CF6','#FF7A3D','#3FC35F','#FF5FA2','#ffffff'];
  for(let i=0;i<8;i++) s+=`<rect x="${125*i+2}" y="80" width="121" height="24" rx="3" fill="${bc[i]}"/>`;
  // markings (world: x 70..930 is the pitch, z 0..1 its width)
  const L=70,Rr=930, circ=[];
  for(let t=0;t<=64;t++){ const a=t/64*Math.PI*2; circ.push(proj(500+75*Math.cos(a), ZP+.1346*Math.sin(a))); }
  s+=`<polyline points="${pts([proj(L,0),proj(L,1),proj(Rr,1),proj(Rr,0)])}" ${line}/>`;
  s+=`<line x1="${proj(500,0)[0]}" y1="${proj(500,0)[1]}" x2="${proj(500,1)[0]}" y2="${proj(500,1)[1]}" ${line}/>`;
  s+=`<polygon points="${pts(circ)}" ${line}/>`;
  s+=`<circle cx="${proj(500,ZP)[0]}" cy="${proj(500,ZP)[1]}" r="4" fill="#fff"/>`;
  for(const [gx,dir] of [[L,1],[Rr,-1]]){
    s+=`<polyline points="${pts([proj(gx,.2035),proj(gx+dir*135,.2035),proj(gx+dir*135,.7965),proj(gx,.7965)])}" ${line}/>`;
    s+=`<polyline points="${pts([proj(gx,.3655),proj(gx+dir*45,.3655),proj(gx+dir*45,.6345),proj(gx,.6345)])}" ${line}/>`;
    s+=`<circle cx="${proj(gx+dir*90,ZP)[0]}" cy="${proj(gx+dir*90,ZP)[1]}" r="4" fill="#fff"/>`;
  }
  // goals – back parts (net back, roof, far side)
  s+=goalParts('back'); s+='</svg>';
  $('#pitch').innerHTML=s;
  $('#front').innerHTML='<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg"><defs>'+
    '<pattern id="net2" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0H7M0 0V7" stroke="rgba(255,255,255,.75)" stroke-width="1"/></pattern></defs>'+goalParts('front')+'</svg>';
}
function goalParts(layer){
  let s=''; const H=GOAL_H;
  for(const [fx,bx] of [[GOAL_W,10],[FIELD_W-GOAL_W,FIELD_W-10]]){
    const panel=(q,id)=>`<polygon points="${pts(q)}" fill="rgba(255,255,255,.16)"/><polygon points="${pts(q)}" fill="url(#${id})"/>`;
    const bar=(a,b,w)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="#fff" stroke-width="${w}" stroke-linecap="round"/>`;
    if(layer==='back'){
      s+=panel([proj(bx,GZ1),proj(bx,GZ2),proj(bx,GZ2,H),proj(bx,GZ1,H)],'net');          // back net
      s+=panel([proj(fx,GZ2),proj(bx,GZ2),proj(bx,GZ2,H),proj(fx,GZ2,H)],'net');          // far side net
      s+=panel([proj(fx,GZ1,H),proj(fx,GZ2,H),proj(bx,GZ2,H),proj(bx,GZ1,H)],'net');      // roof
      s+=bar(proj(bx,GZ1),proj(bx,GZ1,H),3)+bar(proj(bx,GZ2),proj(bx,GZ2,H),3)+bar(proj(bx,GZ1,H),proj(bx,GZ2,H),3);
      s+=bar(proj(fx,GZ2),proj(fx,GZ2,H),6)+bar(proj(fx,GZ2,H),proj(bx,GZ2,H),3);
    }else{
      s+=panel([proj(fx,GZ1),proj(bx,GZ1),proj(bx,GZ1,H),proj(fx,GZ1,H)],'net2');         // near side net (in front of the ball)
      s+=bar(proj(fx,GZ1,H),proj(bx,GZ1,H),3);
      s+=bar(proj(fx,GZ1),proj(fx,GZ1,H),7)+bar(proj(fx,GZ1,H),proj(fx,GZ2,H),7);          // near post + crossbar
    }
  }
  return s;
}

/* ---------- confetti ---------- */
function makeConfetti(cv, colors){
  const ctx=cv.getContext('2d'); let parts=[]; let running=false; let last=0;
  function burst(n=180){
    for(let i=0;i<n;i++) parts.push({x:Math.random()*1000, y:-20-Math.random()*200, w:8+Math.random()*8, h:5+Math.random()*6,
      vx:(Math.random()-.5)*120, vy:120+Math.random()*220, r:Math.random()*6.28, vr:(Math.random()-.5)*10, c:colors[i%colors.length]});
    if(!running){ running=true; last=performance.now(); requestAnimationFrame(tick); }
  }
  function tick(t){
    const dt=Math.min(.05,(t-last)/1000); last=t;
    ctx.clearRect(0,0,1000,620);
    parts=parts.filter(p=>p.y<640);
    for(const p of parts){
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt; p.vx+=Math.sin(p.y/30)*20*dt;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    }
    if(parts.length) requestAnimationFrame(tick); else { running=false; ctx.clearRect(0,0,1000,620); }
  }
  return { burst };
}
const confetti    = makeConfetti($('#confetti'),     ['#FFD447','#FF7A3D','#3D8BFF','#3FC35F','#8E5CF6','#FF5FA2','#fff']);
const ceoConfetti = makeConfetti($('#ceo-confetti'), ['#FFD447','#FFE27A','#fff7c2','#C98A00','#fff','#FF7A3D','#FFD447']);

/* ---------- input ---------- */
function setKey(code,down){
  switch(code){
    case 'KeyA': case 'ArrowLeft':  keys.left=down; return true;
    case 'KeyD': case 'ArrowRight': keys.right=down; return true;
    case 'KeyW': case 'ArrowUp':    if(down&&!keys.jump) jumpQueued=true; keys.jump=down; return true;
    case 'Space':                   if(down&&!keys.kick) kickQueued=true; keys.kick=down; return true;
  }
  return false;
}
window.addEventListener('keydown', e=>{
  if(state!=='play'){ if(e.code==='Space') e.preventDefault(); return; }
  if(e.repeat){ if(setKey(e.code,true)) e.preventDefault(); return; }
  if(setKey(e.code,true)) e.preventDefault();
});
window.addEventListener('keyup', e=>{ if(setKey(e.code,false)) e.preventDefault(); });
window.addEventListener('blur', ()=>{ keys.left=keys.right=keys.jump=keys.kick=false; });

document.querySelectorAll('#touch .btn').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{ e.preventDefault(); b.classList.add('pressed'); if(k==='jump') jumpQueued=true; else if(k==='kick') kickQueued=true; else keys[k]=true; };
  const up=e=>{ e.preventDefault(); b.classList.remove('pressed'); if(k==='left'||k==='right') keys[k]=false; };
  b.addEventListener('pointerdown',down); b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('pointerleave',up);
});

function startGame(levelIdx){
  level=LEVELS[levelIdx];
  myChar=CHARS[selected];
  const others=CHARS.filter((c,i)=>i!==selected);
  opChar=others[Math.floor(Math.random()*others.length)];
  sprite(P1.el.querySelector('.sprite'), myChar);
  sprite(P2.el.querySelector('.sprite'), opChar);
  P1.el.querySelector('.tag').textContent='אני – '+myChar.name;
  P2.el.querySelector('.tag').textContent=opChar.name;
  $('#n-me').textContent=myChar.name; $('#n-op').textContent=opChar.name;
  $('#level-tag').textContent='רמה: '+level.name;
  score={me:0,op:0}; updateScore();
  timeLeft=MATCH_TIME; updateTimer();
  $('#end').classList.remove('show');
  $('#fans').classList.remove('cheer');
  resetPositions();
  showScreen('game');
  keys.left=keys.right=keys.jump=keys.kick=false; jumpQueued=kickQueued=false;
  sfx.whistle();
  state='play';
  lastT=performance.now();
  cancelAnimationFrame(rafId); rafId=requestAnimationFrame(loop);
}

function resetPositions(){
  P1.x=230; P1.y=0; P1.vx=P1.vy=0; P1.facing=1;
  P2.x=770; P2.y=0; P2.vx=P2.vy=0; P2.facing=-1; P2.reactT=0; P2.targetX=P2.x;
  ball.x=500; ball.y=R; ball.vx=0; ball.vy=0;
  P1.el.classList.remove('running','kicking'); P2.el.classList.remove('running','kicking');
  render();
}

function updateScore(){ $('#s-me').textContent=score.me; $('#s-op').textContent=score.op; }
function updateTimer(){
  const t=Math.max(0,Math.ceil(timeLeft)), m=Math.floor(t/60), s=t%60;
  const el=$('#timer'); el.textContent=`${m}:${s<10?'0':''}${s}`;
  el.classList.toggle('urgent', t<=10 && state==='play');
}

function goHome(){
  state='idle'; cancelAnimationFrame(rafId);
  $('#end').classList.remove('show'); $('#fans').classList.remove('cheer');
  showScreen('home');
}

function endGame(){
  state='end';
  const t=$('#end-title'), sub=$('#end-sub');
  let win;
  if(score.me>score.op){ win=true; t.textContent='ניצחת! 🏆'; sub.textContent='כל הכבוד, כוכב אמיתי!'; sfx.win(); confetti.burst(260); $('#fans').classList.add('cheer'); }
  else if(score.me<score.op){ win=false; t.textContent='הפסדת 😢'; sub.textContent='נסה שוב – בפעם הבאה תנצח!'; sfx.lose(); }
  else { win=false; t.textContent='תיקו 🤝'; sub.textContent='תיקו נחשב הפסד... כמעט! נסה שוב'; sfx.lose(); }
  updateTimer();
  $('#end').classList.add('show');
  setTimeout(goHome, 3000);
}

function scoreGoal(who){
  if(state!=='play') return;
  state='celebrate';
  if(who==='me') score.me++; else score.op++;
  updateScore();
  ball.vx*=.2; ball.vy=0;
  P1.el.classList.remove('running'); P2.el.classList.remove('running');
  sfx.goal(); confetti.burst(200);
  $('#fans').classList.add('cheer');
  const f=$('#goal-flash'); f.classList.remove('show'); void f.offsetWidth; f.classList.add('show');
  setTimeout(()=>{
    $('#fans').classList.remove('cheer');
    if(score.me+score.op>=3){ endGame(); return; }
    resetPositions(); sfx.whistle(); state='play'; lastT=performance.now();
  }, 1900);
}

/* ---------- physics ---------- */
function overlaps(p,nx,o){ return Math.abs(nx-o.x)<PW && p.y<o.y+PH && o.y<p.y+PH; }

function movePlayer(p,dt,other){
  const nx=clamp(p.x+p.vx*dt, MINX, MAXX);
  if(!(p.vx!==0 && overlaps(p,nx,other))) p.x=nx;
  p.vy-=G*dt; p.y+=p.vy*dt;
  if(p.y<=0){ p.y=0; p.vy=0; }
  if(overlaps(p,p.x,other)){ const dir=p.x<other.x?-1:1; p.x=clamp(other.x+dir*PW, MINX, MAXX); }
  if(p.kickT>0) p.kickT-=dt;
}

function inReach(p){ return Math.hypot(ball.x-p.x, ball.y-(p.y+22))<REACH; }

function doKick(p,power=1){
  if(p.kickT>0) return;
  p.kickT=.35;
  p.el.classList.remove('kicking'); void p.el.offsetWidth; p.el.classList.add('kicking');
  if(!inReach(p)) return;
  let d=ball.x-p.x; d=Math.abs(d)<10 ? p.facing : Math.sign(d);
  ball.vx=d*(900+Math.abs(p.vx)*.4)*power;
  ball.vy=320+Math.random()*200;
  sfx.kick();
}

function collideBall(p){
  const left=p.x-PW/2, right=p.x+PW/2, bottom=p.y, top=p.y+PH;
  const cx=clamp(ball.x,left,right), cy=clamp(ball.y,bottom,top);
  let dx=ball.x-cx, dy=ball.y-cy, d=Math.hypot(dx,dy);
  if(d>=R) return;
  if(d<0.001){ dx=ball.x<p.x?-1:1; dy=0; d=1; }
  const nx=dx/d, ny=dy/d;
  ball.x=cx+nx*R; ball.y=cy+ny*R;
  if(Math.abs(nx)>Math.abs(ny)){                 // side hit → push forward
    const push=Math.max(250, Math.abs(ball.vx)*.55);
    ball.vx=nx*push+p.vx*.9;
    if(ball.vy<110) ball.vy=110+Math.abs(p.vx)*.25;
  }else if(ny>0){                                 // header
    ball.vy=Math.max(Math.abs(ball.vy)*.7, 300); ball.vx+=p.vx*.5+nx*120;
  }else{ ball.vy=Math.min(ball.vy,-150); }
  sfx.bounce();
}

function collideRect(x1,y1,x2,y2){               // solid rect (crossbar / net roof)
  const cx=clamp(ball.x,x1,x2), cy=clamp(ball.y,y1,y2);
  let dx=ball.x-cx, dy=ball.y-cy, d=Math.hypot(dx,dy);
  if(d>=R||d<0.001) return;
  const nx=dx/d, ny=dy/d;
  ball.x=cx+nx*R; ball.y=cy+ny*R;
  if(Math.abs(nx)>Math.abs(ny)) ball.vx=-ball.vx*.6; else ball.vy=-ball.vy*.6;
  sfx.bounce();
}

function updateBall(dt){
  ball.vy-=G*dt;
  ball.x+=ball.vx*dt; ball.y+=ball.vy*dt;
  ball.vx*=Math.pow(.88,dt);
  if(ball.y<R){ ball.y=R; if(ball.vy<0){ ball.vy=-ball.vy*.55; if(ball.vy<70) ball.vy=0; else sfx.bounce(); } ball.vx*=Math.pow(.3,dt); }
  if(ball.y>CEIL){ ball.y=CEIL; ball.vy=-Math.abs(ball.vy)*.5; }
  // goal roofs
  collideRect(0,GOAL_H-8,GOAL_W,GOAL_H);
  collideRect(FIELD_W-GOAL_W,GOAL_H-8,FIELD_W,GOAL_H);
  // walls / goals
  if(ball.x-R<0){ ball.x=R; ball.vx=Math.abs(ball.vx)*.6; }
  if(ball.x+R>FIELD_W){ ball.x=FIELD_W-R; ball.vx=-Math.abs(ball.vx)*.6; }
  if(ball.y+R<GOAL_H){
    if(ball.x<GOAL_W-22) scoreGoal('op');
    else if(ball.x>FIELD_W-GOAL_W+22) scoreGoal('me');
  }
  ball.vx=clamp(ball.vx,-1300,1300); ball.vy=clamp(ball.vy,-1500,1500);
  ball.rot+=ball.vx*dt/R;
}

/* ---------- AI ---------- */
function updateAI(dt){
  const ai=P2, L=level;
  ai.reactT-=dt;
  if(ai.reactT<=0){
    ai.reactT=L.react;
    const err=(Math.random()*2-1)*L.err;
    ai.targetX=clamp(ball.x+50+err, MINX, MAXX);
    ai.wantKick=Math.random()<L.kick;
  }
  const diff=ai.targetX-ai.x;
  const dir=Math.abs(diff)>6 ? Math.sign(diff) : 0;
  ai.vx=dir*MOVE*L.speed;
  ai.facing = ball.x<ai.x ? -1 : 1;
  if(ai.y===0){
    const blocked = dir!==0 && overlaps(ai, ai.x+dir*12, P1);
    const ballHigh = ball.y>60 && Math.abs(ball.x-ai.x)<80;
    if((blocked && Math.random()<L.jump*dt*4) || (ballHigh && Math.random()<L.jump*dt*3)) ai.vy=JUMP;
  }
  if(ai.wantKick && ball.x<ai.x+12 && inReach(ai) && Math.random()<L.kick*dt*9) doKick(ai,L.power);
}

/* ---------- loop ---------- */
function loop(t){
  rafId=requestAnimationFrame(loop);
  const dt=Math.min(.033,(t-lastT)/1000); lastT=t;
  if(state==='play'){
    // player 1
    let d=0; if(keys.left) d-=1; if(keys.right) d+=1;
    P1.vx=d*MOVE; if(d) P1.facing=d;
    if(jumpQueued && P1.y===0) P1.vy=JUMP;
    jumpQueued=false;
    if(kickQueued){ doKick(P1); kickQueued=false; }
    updateAI(dt);
    movePlayer(P1,dt,P2); movePlayer(P2,dt,P1);
    updateBall(dt);
    collideBall(P1); collideBall(P2);
    timeLeft-=dt; updateTimer();
    if(timeLeft<=0){ timeLeft=0; endGame(); }
  }else if(state==='celebrate'){
    ball.vx*=Math.pow(.2,dt); ball.x+=ball.vx*dt;
  }
  render();
}

const SH={P1:$('#sh1'),P2:$('#sh2'),B:$('#shb')};
function shadow(el,x,h,w){ const k=Math.max(.35,1-h/420); el.style.transform=`translate(${x-32}px,${GROUND_Y-7}px) scale(${(w*k).toFixed(3)},${k.toFixed(3)})`; el.style.opacity=(.3*k).toFixed(2); }
function render(){
  shadow(SH.P1,P1.x,P1.y,1.1); shadow(SH.P2,P2.x,P2.y,1.1); shadow(SH.B,ball.x,ball.y-R,.45);
  for(const p of [P1,P2]){
    p.el.style.transform=`translate(${p.x-PW/2}px,${GROUND_Y-p.y-PH}px)`;
    p.el.querySelector('.sprite').classList.toggle('flip', p.facing<0);
    p.el.classList.toggle('running', state==='play' && p.vx!==0 && p.y===0);
  }
  ball.el.style.transform=`translate(${ball.x-R}px,${GROUND_Y-ball.y-R}px) rotate(${ball.rot}rad)`;
}

/* ---------- init ---------- */
buildPitch(); buildGallery(); refreshHome(); refreshPreview(); resetPositions();
</script>
</body>
