        S = fresh(2); S.lv.p.x = 13; run(S, NOIN, 2); var doorX0 = S.lv.door.x; run(S, NOIN, 60);
        ok('door runs away when approached', S.lv.fired[0] && S.lv.door.x > doorX0 + 2, S.lv.door.x);
        run(S, NOIN, 400);
        ok('running door stops at its max', S.lv.door.x === 29 && S.lv.door.vx === 0);
        S = fresh(16); S.lv.p.x = 6; run(S, NOIN, 2); var chx = S.lv.chasers[0].x; run(S, NOIN, 60);
        ok('chaser moves toward the player', S.lv.chasers.length === 1 && S.lv.chasers[0].x > chx + 2, S.lv.chasers[0].x);
        S = fresh(17); run(S, NOIN, Math.round(1.1 * HZ)); var sh0 = S.lv.shakes.length; run(S, NOIN, 20);
        ok('after-seconds trigger fires at its time', sh0 === 0 && S.lv.shakes.length === 12 && S.lv.fired[0], sh0 + ' ' + S.lv.shakes.length);
        S = fresh(17); S.lv.p.x = 12; run(S, NOIN, Math.round(3.05 * HZ));
        ok('stand-still trigger opens the locked door after 3 s', !S.lv.door.locked, S.lv.stillF);
        S = fresh(17); S.lv.p.x = 12; run(S, NOIN, Math.round(2 * HZ)); run(S, RI, 2); run(S, NOIN, Math.round(1.5 * HZ));
        ok('moving resets the stand-still counter', S.lv.door.locked);
        S = fresh(24); S.lv.p.x = 20; run(S, NOIN, 2); var nb = S.lv.balls.length; run(S, NOIN, Math.round(0.75 * HZ));
        ok('scheduled (later) action fires', nb === 1 && S.lv.balls.length === 2, S.lv.balls.length);
        S = fresh(34); run(S, NOIN, Math.round(1.05 * HZ)); var w1 = tileAt(S.lv, 10, 15); run(S, NOIN, Math.round(0.35 * HZ)); var s1 = tileAt(S.lv, 10, 15); run(S, NOIN, Math.round(0.65 * HZ)); var e1 = tileAt(S.lv, 10, 15); run(S, NOIN, Math.round(1.05 * HZ)); var s2 = tileAt(S.lv, 10, 15);
        ok('every-trigger: warning dots, then spikes, then clear, then again', w1 === 'w' && s1 === '^' && e1 === '.' && s2 === '^', w1 + s1 + e1 + s2);
        S = fresh(20); S.lv.p.x = 25.5; run(S, NOIN, 2);
        ok('teleporting door (level 21) jumps away when near', S.lv.door.x === 15 && S.lv.fired[0] && !S.lv.fired[1]);
        S = fresh(36); run(S, RI, 200); run(S, NOIN, PH.dead + 2);
        ok('deaths trigger (level 37) opens the door after one death', S.lvDeaths === 1 && !S.lv.door.locked);
        S = flat();
        ok('collide(): floor box hits, air box does not', collide({ x:5, y:16.5, w:0.5, h:0.5 }, S.lv) && !collide({ x:5, y:10, w:0.5, h:0.5 }, S.lv) && collide({ x:-0.5, y:10, w:0.4, h:0.4 }, S.lv));
        ok('hazardHit distinguishes spike and lava', (function(){ var s2 = fresh(1); return hazardHit(s2.lv, { x:7.2, y:15.2 }) === 'spike' && hazardHit(s2.lv, { x:2, y:15 }) === null; })());
        /* --- all 40 solutions (main correctness test) --- */
        var totalDeaths = 0;
        for (i = 0; i < LEVELS.length; i++){
          var res = simulate(i, LEVELS[i].solution);
          totalDeaths += res.deaths;
          ok('solution ' + (i + 1) + ' (' + LEVELS[i].name[1] + ') reaches the door', res.won, JSON.stringify(res));
        }
        ok('solutions die at most once in total (level 37 needs one death)', totalDeaths <= 1, totalDeaths);
        var r1 = simulate(0, LEVELS[0].solution), r2 = simulate(0, LEVELS[0].solution);
        ok('simulate is deterministic', r1.frames === r2.frames && r1.x === r2.x && r1.y === r2.y);
        ok('solution 1 is not trivial (the floor trap forces a jump)', LEVELS[0].solution.some(function(e){ return e[1].indexOf('J') >= 0; }));
        /* --- stars + storage --- */
        ok('stars rule: <=3 deaths = 3, <=10 = 2, else 1', starsFor(0) === 3 && starsFor(3) === 3 && starsFor(4) === 2 && starsFor(10) === 2 && starsFor(11) === 1);
        G.unlocked = 1; G.stars = {}; G.deaths = {}; G.best = {}; G.totalDeaths = 0; G.totalMs = 0; G.demo = false;
        I.start(0); G.lvDeaths = 2; G.lvFrames = 600; G.fx.length = 0; I.onWin();
        ok('winning level 1 gives 3 stars, best time and unlocks level 2', G.stars[1] === 3 && G.best[1] === 5000 && G.unlocked === 2 && G.over);
        var stored = null; try { stored = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
        ok('persisted under the storage key (or storage unavailable)', stored === null || (stored.unlocked === 2 && stored.stars['1'] === 3 && stored.best['1'] === 5000 && typeof stored.totalDeaths === 'number' && stored.lang === 'he' && typeof stored.mute === 'boolean'));
        G.unlocked = 1; G.stars = {}; G.best = {}; I.load();
        ok('load() restores progress (or keeps defaults without storage)', stored === null ? G.unlocked === 1 : (G.unlocked === 2 && G.stars[1] === 3));
        /* --- UI --- */
        I.show('s-select');
        var btns = document.querySelectorAll('#worlds .lv');
        ok('level select shows 40 buttons in 4 worlds', btns.length === 40 && document.querySelectorAll('#worlds .world').length === 4);
        ok('locks: levels 1-2 open, 3+ locked', !btns[0].classList.contains('locked') && !btns[1].classList.contains('locked') && btns[2].classList.contains('locked') && btns[39].classList.contains('locked'));
        ok('completed level shows stars', btns[0].classList.contains('done') && btns[0].querySelector('.st').textContent === '★★★');
        btns[5].click();
        ok('clicking a locked level does nothing', G.screen === 's-select');
        btns[1].click();
        ok('clicking an open level starts it', G.screen === 's-game' && G.level === 1 && document.body.classList.contains('ingame') && $('h-name').textContent.indexOf('2.') > 0);
        I.show('s-select'); $('b-random').click();
        ok('random button starts an unlocked level', G.screen === 's-game' && G.level < 2);
        $('b-restart').click();
        ok('restart resets the level without adding a death', G.lv.frame === 0 && G.lvDeaths === 0 && !G.over);
        document.dispatchEvent(new KeyboardEvent('keydown', { code:'ArrowRight' })); tick(); tick();
        ok('keyboard: ArrowRight accelerates', G.lv.p.vx > 0);
        document.dispatchEvent(new KeyboardEvent('keyup', { code:'ArrowRight' }));
        document.dispatchEvent(new KeyboardEvent('keydown', { code:'Escape' }));
        ok('Esc opens the level select', G.screen === 's-select');
        I.setLang('en');
        ok('setLang(en) sets dir ltr and translates', document.documentElement.dir === 'ltr' && $('b-play').textContent === T.en.play && $('b-lang').textContent === 'עב' && document.querySelector('#worlds h3').textContent.indexOf('Beginnings') > 0);
        I.setLang('he');
        ok('setLang(he) sets dir rtl', document.documentElement.dir === 'rtl' && $('b-play').textContent === T.he.play);
        I.start(39); G.lvDeaths = 1; G.lvFrames = 1200; G.totalDeaths = 312; G.fx.length = 0; I.onWin(); I.next();
        ok('finishing level 40 shows the ending with the death joke', G.screen === 's-end' && $('end-joke').textContent === 'מתת רק 312 פעמים!', $('end-joke').textContent);
        I.start(0);
        ok('canvas is 768x432 logical pixels', cv.width === 768 && cv.height === 432);
        var st = $('stage').getBoundingClientRect();
        ok('stage keeps 16:9 and fits the viewport', Math.abs(st.width / st.height - 16 / 9) < 0.02 && st.right <= window.innerWidth + 1 && st.bottom <= window.innerHeight + 1, st.width + 'x' + st.height);
        ok('touch buttons exist', !!$('t-left') && !!$('t-right') && !!$('t-jump'));
        ok('quip shown at level start', $('quip').classList.contains('on') && $('quip').textContent === LEVELS[0].quip[0]);
        I.kill(); handleFX();
        ok('death: skull pops, particles, counter', $('skull').classList.contains('go') && R.parts.length > 5 && G.lvDeaths === 1 && $('h-deaths').textContent.indexOf('1') > 0 || (hud(), $('h-deaths').textContent.indexOf('1') > 0));
        ok('no horizontal overflow', document.documentElement.scrollWidth <= window.innerWidth + 1, document.documentElement.scrollWidth + '>' + window.innerWidth);
        I.show('s-title');
        ok('title stats card reflects progress', $('st-done').textContent.indexOf('/40') > 0);
        ok('no runtime errors', errs.filter(function(x){ return x.indexOf('onerror') === 0 || x.indexOf('init') === 0; }).length === 0);
      } catch(e){ errs.push('exception: ' + (e && e.stack || e)); }
      done();
    })();
  })();
}
})();
</script>
