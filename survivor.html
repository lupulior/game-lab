        ok('completed level shows stars', btns[0].classList.contains('done') && btns[0].querySelector('.st').textContent === '★★★');

        $('w-next').click(); $('w-next').click(); $('w-prev').click();

        I.setLang('en'); ok('world header is translated', document.querySelectorAll('#worlds .world h3')[12].textContent.indexOf('World 13') >= 0 && document.querySelectorAll('#worlds .world h3')[12].textContent.indexOf(WORLDS[12][2]) > 0); I.setLang('he');
        I.selectWorld(0); btns = document.querySelectorAll('#worlds .lv');
        btns[5].click();
        ok('clicking a locked level does nothing', G.screen === 's-select');
        btns[1].click();
        ok('clicking an open level starts it', G.screen === 's-game' && G.level === 1 && document.body.classList.contains('ingame') && $('h-name').textContent.indexOf('2.') > 0);
        I.show('s-select'); $('b-random').click();
        ok('random button starts an unlocked level', G.screen === 's-game' && G.level < 2);

        document.dispatchEvent(new KeyboardEvent('keydown', { code:'ArrowRight' })); tick(); tick();
        ok('keyboard: ArrowRight accelerates', G.lv.p.vx > 0);
        document.dispatchEvent(new KeyboardEvent('keyup', { code:'ArrowRight' }));
        document.dispatchEvent(new KeyboardEvent('keydown', { code:'Escape' }));
        ok('Esc opens the level select', G.screen === 's-select');
        I.setLang('en');
        ok('setLang(en) sets dir ltr and translates', document.documentElement.dir === 'ltr' && $('b-lang').textContent === 'עב' && document.querySelector('#worlds h3').textContent.indexOf('Beginnings') > 0 && $('w-prev').textContent === '←');
        I.setLang('he');
        ok('setLang(he) sets dir rtl', document.documentElement.dir === 'rtl' && $('w-prev').textContent === '→');
        I.show('s-title');
        ok('title button says continue once progress exists', $('b-play').textContent === T.he.cont);
        I.start(39); G.lvDeaths = 1; G.lvFrames = 1200; G.fx.length = 0; I.onWin(); I.next();
        ok('finishing level 40 shows the mid celebration', G.screen === 's-end' && G.endMid === true && $('end-title').textContent === T.he.endTitleMid && $('end-joke').textContent === T.he.endJokeMid && !$('b-end-next').classList.contains('hidden'), $('end-title').textContent);
        $('b-end-next').click();
        ok('continue goes to level 41 (world 5)', G.screen === 's-game' && G.level === 40 && G.selWorld === 4 && $('h-name').textContent.indexOf('41.') > 0);
        I.start(239); G.lvDeaths = 1; G.lvFrames = 1200; G.fx.length = 0; I.onWin(); I.next();
        ok('finishing level 240 simply continues to 241', G.screen === 's-game' && G.level === 240);
        I.start(499); G.lvDeaths = 1; G.lvFrames = 1200; G.totalDeaths = 312; G.fx.length = 0; I.onWin(); I.next();
        ok('finishing level 500 shows the final ending with the death joke', G.screen === 's-end' && G.endMid === false && $('end-joke').textContent === 'מתת רק 312 פעמים!' && $('end-title').textContent.indexOf('500') > 0 && $('end-stats').textContent.indexOf('/1500') > 0 && $('b-end-next').classList.contains('hidden'), $('end-joke').textContent);
        ok('level 500 unlock cap holds', G.unlocked === 500);
        I.start(0);
        ok('canvas is 768x432 logical pixels', cv.width === 768 && cv.height === 432);
        var st = $('stage').getBoundingClientRect();
        ok('stage keeps 16:9 and fits the viewport', Math.abs(st.width / st.height - 16 / 9) < 0.02 && st.right <= window.innerWidth + 1 && st.bottom <= window.innerHeight + 1, st.width + 'x' + st.height);

        ok('quip shown at level start', $('quip').classList.contains('on') && $('quip').textContent === LEVELS[0].quip[0]);
        I.kill(); handleFX();
        ok('death: skull pops, particles, counter', $('skull').classList.contains('go') && R.parts.length > 5 && G.lvDeaths === 1 && $('h-deaths').textContent.indexOf('1') > 0 || (hud(), $('h-deaths').textContent.indexOf('1') > 0));
        ok('no horizontal overflow', document.documentElement.scrollWidth <= window.innerWidth + 1, document.documentElement.scrollWidth + '>' + window.innerWidth);
        I.show('s-title');
        ok('title stats card reflects progress', $('st-done').textContent.indexOf('/500') > 0 && +$('st-deaths').textContent === G.totalDeaths, $('st-done').textContent);
        /* --- 🔑 shared code button (GL) --- */
        var glk = $('s-title').querySelector('.gl-key');
        ok('🔑 code button: last element of the title screen, ≥ 32 px tall', !!glk && $('s-title').lastElementChild === glk && glk.offsetHeight >= 32, glk && glk.offsetHeight);
        var gla = GL.submit(GL.ADMIN); ok('🔑 admin code turns on admin mode (gl.admin=1)', !!gla && gla.ok === true && localStorage.getItem('gl.admin') === '1');
        var glx = GL.submit('nonsense'); ok('🔑 a wrong code is refused', !!glx && glx.ok === false);
        GL.setAdmin(false); try { localStorage.removeItem('gl.used'); localStorage.removeItem('gl.plays.survivor'); } catch(e){}
        ok('no runtime errors', errs.filter(function(x){ return x.indexOf('onerror') === 0 || x.indexOf('init') === 0; }).length === 0);
      } catch(e){ errs.push('exception: ' + (e && e.stack || e)); }
      done();
    })();
  })();
}
})();
