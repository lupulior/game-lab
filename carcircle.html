        S = I.newLevel(0, 3); var honks = 0; for (i = 0; i < HZ * 13; i++){ I.step(); honks += S.ev.filter(function(e){ return e === 'honk'; }).length; S.ev.length = 0; }
        ok('impatient cars honk before the jam', honks >= 2, honks);
        /* ambulance slows the ring */
        S = I.newLevel(20, 1); S.queues[0][0] = VI.amb; newHead(S, 0);
        ok('ambulance at the head of a queue triggers the siren slowdown', S.slowT === 2 && S.ev.indexOf('siren') >= 0);
        for (i = 0; i < HZ * 0.5; i++) I.step();
        var aS = S.ring[0].a; I.step(); var moved = mod(S.ring[0].a - aS, C);
        ok('ring traffic slows while the siren is on (time dilation)', S.slowF < 0.8 && moved < I.LEVELS[20].speed * DT * 0.8 && moved > 0);
        for (i = 0; i < HZ * 3; i++) I.step();
        ok('ring traffic recovers after 2s with no crash', !S.over && S.slowF === 1 && S.slowT <= 0);
        /* win + stars */
        S = I.newLevel(0, 4); S.merged = S.lv.target - 1; var m0 = S.merged;
        for (i = 0; i < HZ * 30 && !S.over; i++){ I.step(); if (i % 12 === 0 && !I.canSend(0) && !I.wouldCrash(0)) I.send(0); if (i % 12 === 0 && !I.canSend(2) && !I.wouldCrash(2)) I.send(2); }
        ok('reaching the target wins the level', S.over && S.won && S.merged >= S.lv.target && S.merged > m0);
        ok('3 stars with >=40% time left, 2 with >=15%, 1 otherwise', (function(){ var st = { won:true, lv:I.LEVELS[0], timeLeft:30 }; var a = I.starsFor(st); st.timeLeft = 12; var b = I.starsFor(st); st.timeLeft = 2; var c = I.starsFor(st); st.won = false; return a === 3 && b === 2 && c === 1 && I.starsFor(st) === 0; })());
        /* perfect bonus */
        S = I.newLevel(0, 5); S.ring.length = 0; var amb = mkCar(S, VI.car, false, -1, null); amb.a = mod(ROADG[0].aIn - 50 - 34 - 60, C); amb.v = S.speed; amb.settled = true; S.ring.push(amb);
        var tr = Math.sqrt(2 * (ROADG[0].ramp.len - ROADG[0].stop) / I.VEHICLES[VI.car].acc); amb.a = mod(ROADG[0].aIn - 34 - 16 - S.speed * tr, C);
        I.send(0); for (i = 0; i < HZ * 4 && S.merged === 0 && !S.over; i++) I.step();
        ok('a tight clean merge gives the perfect bonus', S.merged === 1 && S.perfects === 1 && !S.over, JSON.stringify({ m:S.merged, p:S.perfects, over:S.over, r:S.reason }));
        /* --- winnability of all 60 levels by the auto-player --- */
        var t0 = performance.now(), fails = [];
        for (var li = QUICK ? NLV : SWEEP[0] - 1; li < Math.min(NLV, QUICK ? 0 : SWEEP[1]); li++){
          var won = false, tries = [];
          for (var sd = 1; sd <= 4 && !won; sd++){ var res = I.simulateAuto(li, sd); tries.push(res.reason + '@' + res.time + ' m=' + res.merged); if (res.won && res.time <= I.LEVELS[li].time) won = true; }
          ok('level ' + (li + 1) + ' winnable by auto-player', won, tries.join(' | '));
          if (!won) fails.push(li + 1);
        }
        ok('winnability sweep finished (' + Math.round(performance.now() - t0) + 'ms)', true);
        var e1 = I.simulateAuto(NLV, 1, 25); ok('endless mode runs and scores (' + e1.merged + ' merges in 25s)', e1.merged >= 5, JSON.stringify(e1));
        /* --- storage / i18n / DOM --- */
        try { localStorage.removeItem(KEY); } catch(e){}
        G.unlocked = 7; G.stars = [3, 2, 1, 3, 3, 2]; G.best = [40, 30, 10, 42, 41, 25]; G.endlessBest = 44; I.save();
        var stored = null; try { stored = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
        ok('progress saved under carcircle.v1', stored === null || (stored.unlocked === 7 && stored.stars[0] === 3 && stored.endlessBest === 44 && stored.best[3] === 42));
        G.unlocked = 1; G.stars = []; I.load(); ok('load restores progress', stored === null || (G.unlocked === 7 && G.stars[3] === 3 && G.endlessBest === 44));
        I.setLang('en');
        ok('setLang(en) sets dir ltr and translates', document.documentElement.dir === 'ltr' && document.documentElement.lang === 'en' && $('b-map').textContent === T.en.map && $('b-lang').textContent === 'עב' && document.title.indexOf('Car Circle') === 0);
        I.setLang('he');
        ok('setLang(he) sets dir rtl', document.documentElement.dir === 'rtl' && $('b-map').textContent === T.he.map);
        I.show('s-map'); ok('map: 60 tiles + endless, locks beyond unlocked, stars and best shown', $('grid').querySelectorAll('.lv').length === 61 && $('grid').querySelectorAll('.lv.lock').length === 61 - 7 + (G.unlocked > NLV ? 0 : 0) && $('grid').querySelector('.lv .s').textContent === '★★★' && $('grid').querySelectorAll('.lv .b').length >= 6);
        ok('continue button points at the furthest level', $('b-continue').textContent.indexOf('7') > 0);
        I.show('s-title'); ok('title stats: done/stars/endless best', $('st-done').textContent === '6/60' && $('st-stars').textContent === '14' && $('st-endless').textContent === '44' && $('vlist').children.length === 8);
        ok('endless button locked until level 60 is done', $('b-endless').disabled === true);
        G.unlocked = 61; I.renderTitle(); ok('endless unlocks after level 60', $('b-endless').disabled === false);
        I.start(0); await sleep(50);
        ok('start(0) shows the game with HUD outside the canvas and the tutorial', G.screen === 's-game' && $('s-game').classList.contains('on') && $('hud').offsetHeight > 0 && !$('hud').closest('#stage') && $('h-count').textContent === '🚗 0/6' && $('h-time').textContent === '⏱ 1:02');
        ok('canvas is 720x720 logical and square on screen', cv.width === 720 && cv.height === 720 && Math.abs($('stage').offsetWidth - $('stage').offsetHeight) <= 1 && $('stage').offsetWidth >= 180);
        ok('goal line names the target and time', $('goal').textContent.indexOf('6') > 0 && $('goal').textContent.indexOf('1:02') > 0);
        ok('text sizes >= 16px', [].slice.call(document.querySelectorAll('.hud .pill, .goal, .btn, .ib')).every(function(e){ return parseFloat(getComputedStyle(e).fontSize) >= 16; }));
        ok('tap zones >= 44px', [].slice.call(document.querySelectorAll('.ib, .btn')).every(function(e){ return e.offsetHeight === 0 || e.offsetHeight >= 44; }));
        I.onKey({ code:'Digit1', preventDefault:function(){} }); ok('key 1 sends from road 1 and hides the tutorial', G.S.ramps[0].length === 1 && $('tut').classList.contains('hidden'));
        I.onKey({ code:'ArrowDown', preventDefault:function(){} }); ok('arrow down sends from the south road', G.S.ramps[2].length === 1);
        G.S.merged = G.S.lv.target; finish(G.S); I.handleEvents(); I.showOver();
        ok('win card shows stars and the next button', $('over').classList.contains('on') && $('ov-stars').textContent.indexOf('★') === 0 && !$('b-next').classList.contains('hidden') && I.R2.parts.length > 50);
        ok('win saved progress and stars', G.stars[0] >= 1 && G.best[0] >= 1);
        I.next(); ok('next starts level 2', G.level === 1 && G.S && !G.S.over);
        ok('vibrate helper is guarded', (function(){ try { vibrate(10); return true; } catch(e){ return false; } })());
        ok('no horizontal overflow', document.documentElement.scrollWidth <= window.innerWidth + 1, document.documentElement.scrollWidth + '>' + window.innerWidth);
        var wide = []; [].slice.call(document.querySelectorAll('#app *')).forEach(function(e){ var r = e.getBoundingClientRect(); if (r.width > 0 && (r.right > window.innerWidth + 1 || r.left < -1)) wide.push((e.id || e.className || e.tagName) + ':' + Math.round(r.left) + '-' + Math.round(r.right)); });
        ok('no element sticks out of the viewport (' + window.innerWidth + 'px)', wide.length === 0, wide.slice(0, 8).join(' | '));
        ok('pwa install snippet present and hidden', !!$('pwa-install') && getComputedStyle($('pwa-install')).display === 'none');
        ok('footer links to the games menu', !!document.querySelector('footer a[href="./"]'));
        ok('JSON-LD VideoGame present', (function(){ try { return JSON.parse(document.querySelector('script[type="application/ld+json"]').textContent)['@type'] === 'VideoGame'; } catch(e){ return false; } })());
        try { localStorage.removeItem(KEY); } catch(e){}
        ok('no runtime errors', errs.filter(function(x){ return x.indexOf('onerror') === 0 || x.indexOf('init') === 0; }).length === 0);
      } catch(e){ errs.push('exception: ' + (e && e.stack || e)); }
      done();
    })();
  })();
}
})();
</script>

<button id="pwa-install" type="button">📲 התקן את המשחק בטלפון</button>
<script>(function(){ var d=null, b=document.getElementById('pwa-install'); if(!b) return; try{ if(localStorage.getItem('pwa.hide')==='1') return; }catch(e){} window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); d=e; b.classList.add('on'); }); window.addEventListener('appinstalled', function(){ b.classList.remove('on'); try{ localStorage.setItem('pwa.hide','1'); }catch(e){} }); b.addEventListener('click', function(){ if(!d) return; var p=d; d=null; b.classList.remove('on'); p.prompt(); }); })();</script>
