        I.onTap(); I.handleEvents(); ok('a second tap right away is a chain crash (fail)', G.S.over && G.S.reason === 'crash' && G.overT > 0);
        I.afterOver(); ok('the crashed level restarts fresh', G.level === 0 && G.S && !G.S.over && G.S.queue.length === 5);
        for (i = 0; i < HZ * 20 && !G.S.over; i++){ I.step(); if (i % 12 === 0) I.autoStep(G.S); } I.handleEvents();
        ok('level 1 completes: cars turn gold and progress unlocks level 2', G.S.won && G.S.cars.every(function(c){ return c.gold; }) && G.unlocked >= 2 && G.best >= 2 && G.overT > 0, JSON.stringify({ won:G.S.won, r:G.S.reason, u:G.unlocked }));
        I.afterOver(); ok('after the win the next level loads automatically', G.level === 1 && G.S && G.S.lv.n === 2 && !G.S.over);
        G.S.cars[0].s = 20; G.S.cars[0].spd = G.S.cars[0].v = 0.0001; I.send(); for (i = 0; i < HZ * 3 && !G.S.over; i++) I.step(); I.handleEvents();
        ok('crash: red flash + shake + 0.9 s restart timer', G.S.over && I.FX.flash > 0 && I.FX.shake > 0 && G.overT > 0 && G.overT <= 0.9);
        I.afterOver(); ok('after a crash the same level restarts', G.level === 1 && G.S && !G.S.over && G.S.queue.length === 5);
        ok('vibrate helper is guarded', (function(){ try { vibrate(10); return true; } catch(e){ return false; } })());
        ok('no horizontal overflow', document.documentElement.scrollWidth <= window.innerWidth + 1, document.documentElement.scrollWidth + '>' + window.innerWidth);
        var wide = []; [].slice.call(document.querySelectorAll('#app *, #s-game *')).forEach(function(e){ var rc = e.getBoundingClientRect(); if (rc.width > 0 && (rc.right > window.innerWidth + 1 || rc.left < -1)) wide.push((e.id || e.className || e.tagName) + ':' + Math.round(rc.left) + '-' + Math.round(rc.right)); });
        ok('no element sticks out of the viewport (' + window.innerWidth + 'px)', wide.length === 0, wide.slice(0, 8).join(' | '));
        ok('pwa install snippet present and hidden', !!$('pwa-install') && getComputedStyle($('pwa-install')).display === 'none');
        ok('footer links to the games menu', !!document.querySelector('footer a[href="./"]'));
        ok('JSON-LD VideoGame present', (function(){ try { return JSON.parse(document.querySelector('script[type="application/ld+json"]').textContent)['@type'] === 'VideoGame'; } catch(e){ return false; } })());
        try { localStorage.removeItem(KEY); } catch(e){}
        /* --- 🔑 shared code button (GL) --- */
        I.show('s-title'); var glk = $('s-title').querySelector('.gl-key');
        ok('🔑 code button: last element of the title screen, ≥ 32 px tall', !!glk && $('s-title').lastElementChild === glk && glk.offsetHeight >= 32, glk && glk.offsetHeight);
        var gla = GL.submit(GL.ADMIN); ok('🔑 admin code turns on admin mode (gl.admin=1)', !!gla && gla.ok === true && localStorage.getItem('gl.admin') === '1');
        var glx = GL.submit('nonsense'); ok('🔑 a wrong code is refused', !!glx && glx.ok === false);
        GL.setAdmin(false); try { localStorage.removeItem('gl.used'); localStorage.removeItem('gl.plays.carcircle'); } catch(e){}
        ok('no runtime errors', errs.filter(function(x){ return x.indexOf('onerror') === 0 || x.indexOf('init') === 0; }).length === 0);
      } catch(e){ errs.push('exception: ' + (e && e.stack || e)); }
      done();
    })();
  })();
}
})();
</script>

<button id="pwa-install" type="button">📲 התקן את המשחק בטלפון</button>
<script>(function(){ var d=null, b=document.getElementById('pwa-install'); if(!b) return; try{ if(localStorage.getItem('pwa.hide')==='1') return; }catch(e){} window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); d=e; b.classList.add('on'); }); window.addEventListener('appinstalled', function(){ b.classList.remove('on'); try{ localStorage.setItem('pwa.hide','1'); }catch(e){} }); b.addEventListener('click', function(){ if(!d) return; var p=d; d=null; b.classList.remove('on'); p.prompt(); }); })();</script>
