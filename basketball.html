  G.time+=h;G.shake=Math.max(0,G.shake-h*3.5);G.netT+=h;G.netSwing[0]*=Math.pow(0.05,h);G.netSwing[1]*=Math.pow(0.05,h);G.rimBend[0]=Math.max(0,G.rimBend[0]-h*2.2);G.rimBend[1]=Math.max(0,G.rimBend[1]-h*2.2);

  for(k=G.bursts.length-1;k>=0;k--){G.bursts[k].life-=h;if(G.bursts[k].life<=0)G.bursts.splice(k,1);}
  for(k=G.confetti.length-1;k>=0;k--){var c=G.confetti[k];c.vy+=200*h;c.vx*=Math.pow(0.6,h);c.x+=c.vx*h;c.y+=c.vy*h;c.rot+=c.vr*h;if(c.y>H+30)G.confetti.splice(k,1);}

  if(G.phase==='ready'){G.phaseT-=h;if(G.phaseT<=0)startJumpBall();}

  else if(G.phase==='score'){G.phaseT-=h;if(G.phaseT<=0)inbound(G.nextPoss);}
  else if(G.phase==='whistle'){G.phaseT-=h;if(G.phaseT<=0){var nx=G.next;G.next=null;if(nx&&nx.type==='ft')startFT(nx.shooter);else inbound(nx?nx.who:1-G.possession);}}
  else if(G.phase==='halftime'){G.phaseT-=h;if(G.phaseT<=0){swapSides();if(G.otNext){G.period++;G.clock=60;G.clockMax=60;G.otNext=false;startJumpBall();}else{G.period=2;G.clock=G.halfLen;G.clockMax=G.halfLen;inbound(1);}}}
  else if(G.phase==='play'){
    if(isFinite(G.clock)){G.clock-=h;if(G.clock<=0){G.clock=0;endPeriod();return;}}

  }

  for(var i=0;i<2;i++){
    var p=G.players[i];
    if(p.out>0){p.out-=h;if(p.out<=0){p.out=0;var own=ownHoop(i);placeIdle(p,own.x+own.dir*240,-own.dir);}continue;}
    var ctl=frozen?{left:false,right:false,jump:false,shoot:false}:(p.cpu?aiDecide(aiState(p,h),G.level):humanCtl(p));

function updateCamera(h){

function computeState(p){

  if(!p.onGround){if(p.shootAnim>0.5)return 'shoot';if(!p.hasBall)return 'block';return 'jump';}
  if(p.shootAnim>0.4)return 'shoot';
  if(p.fakeT>0)return 'fake';
  if(p.swipe>0)return 'steal';
  if(p.landT>0&&Math.abs(p.vx)<60)return 'land';
  if(Math.abs(p.vx)>60)return 'run';
  if(!p.hasBall&&G.phase==='play'&&G.ball.state==='held'&&Math.abs(G.players[1-p.i].x-p.x)<420)return 'defence';

function pause(on){

// ---------- loop ----------
var last=0,acc=0;
function frame(ts){
  if(!last)last=ts;var dt=Math.min(0.1,(ts-last)/1000);last=ts;
  if(!G.manual&&!G.paused&&G.screen==='s-game'){acc+=dt;var n=0;while(acc>=STEP&&n<12){step(STEP);acc-=STEP;n++;}if(acc>=STEP)acc=0;}
  else if(!G.manual&&G.screen==='s-over'){step(dt);}
  else if(G.screen!=='s-game'){G.netT+=dt;if(!G.manual&&(G.screen==='s-player'||G.screen==='s-menu'))animatePreviews(dt);}
  draw();
  requestAnimationFrame(frame);
}

    if(G.screen==='s-game'){input.press(e.code);if(/^(Arrow|Space|Key[ADWS]$|Enter)/.test(e.code))e.preventDefault();}
    else if(G.screen==='s-over'&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();($('b-next').style.display!=='none'?$('b-next'):$('b-again')).click();}
  });
  document.addEventListener('keyup',function(e){input.release(e.code);});
  window.addEventListener('blur',function(){input.clear();});
  var unlock=function(){ac();};
  document.addEventListener('pointerdown',unlock,{once:true});document.addEventListener('keydown',unlock,{once:true});
  var tcs=document.querySelectorAll('.tc');
  for(var i=0;i<tcs.length;i++)(function(el){var k=el.getAttribute('data-k');
    var on=function(e){e.preventDefault();input.touch[k]=true;try{el.setPointerCapture(e.pointerId);}catch(x){}};
    var off=function(e){e.preventDefault();input.touch[k]=false;};
    el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);
    el.addEventListener('contextmenu',function(e){e.preventDefault();});})(tcs[i]);
  $('c-cpu').onclick=function(){beginFlow('cpu');};
  $('c-2p').onclick=function(){beginFlow('2p');};
  $('c-tour').onclick=function(){beginFlow('tour');};
  $('t-back').onclick=function(){if(G.flow&&G.flow.cur===1){G.flow.cur=0;showPlayerPick();}else show('s-menu');};
  $('p-back').onclick=function(){showTeamPick();};
  $('b-mute').onclick=function(){setMute(!G.mute);};
  $('b-lang').onclick=function(){setLang(G.lang==='he'?'en':'he');};
  $('pausebtn').onclick=function(){pause(true);};
  $('b-resume').onclick=function(){pause(false);};
  $('b-quit').onclick=function(){G.paused=false;show('s-menu');};
  $('b-again').onclick=function(){G.tipIdx++;if(G.mode==='tour'){newTournament({team:G.players[0].pl.team,player:G.players[0].pl.idx});startTourRound();}else start(G.lastMode||'cpu',G.lastOpts||{});};
  $('b-next').onclick=function(){G.tipIdx++;startTourRound();};
  $('b-menu').onclick=function(){G.tipIdx++;show('s-menu');};
  window.addEventListener('resize',resize);
  var coarse=false;try{coarse=window.matchMedia('(pointer: coarse)').matches;}catch(e){}

      input.press('KeyS');tick(1.12);ok('super: with a full meter the charge keeps going past 1.0',p1.charging&&p1.charge>1.05,p1.charge);
      input.release('KeyS');tick(STEP);ok('super shot released: flaming ball, meter reset, SUPER! event',G.ball.state==='flying'&&G.ball.flame===true&&G.ball.shot.super===true&&G.super[0]===0&&G.lastEvent.type==='super');
      tick(2.2);ok('super shot from the half line goes in for 3',G.scores[0]===3&&G.lastEvent.type==='score'&&G.lastEvent.super===true,G.scores[0]+' '+G.lastEvent.type);
      // ---- defence stance
      begin('2p');p1=G.players[0];p2=G.players[1];p1.x=800;p2.x=950;tick(0.3);ok('anim: defender near the handler takes a defensive stance',p2.state==='defence'&&!p2.hasBall);
      // ---- halves, side swap, overtime, end
      begin('2p',{halfLen:2,target:0});tick(2.1);ok('half 1 ends -> half-time',G.phase==='halftime'&&G.period===1&&G.attack[0]===1);
      tick(2.6);ok('half 2: sides swapped, P2 inbounds',G.period===2&&G.attack[0]===0&&G.attack[1]===1&&attackHoop(0)===Lh&&G.players[1].hasBall&&G.clock>1.5&&G.clockMax===2);
      tick(2.2);ok('tie at the end of half 2 -> overtime',G.otNext===true&&G.phase==='halftime');
      tick(2.2);ok('overtime: 1-minute period, new jump ball',G.period===3&&G.clock===60&&G.phase==='jump');
      begin('2p',{halfLen:2,target:0});G.scores[0]=5;tick(2.1);tick(2.6);G.period=2;G.clock=0.5;tick(0.6);
      ok('time up in half 2 with a lead ends the match',G.phase==='over'&&G.winner===0&&G.confetti.length>0);
      tick(2.5);ok('match over screen shows winner + stats incl. fouls',G.screen==='s-over'&&$('o-title').textContent.length>0&&$('o-stats').querySelectorAll('tr').length>=7);
      begin('2p',{target:2});dropBall(R,0,{three:false,points:2,hoop:1});tick(0.4);ok('first-to-N mode ends at the target',G.phase==='over'&&G.winner===0);
      // ---- CPU plays
      begin('cpu',{level:2,seed:9,poss:1});tick(8);ok('hard CPU dribbles the court and attempts a shot within 8 s',G.players[1].stats.shots>=1||G.scores[1]>0,G.players[1].stats.shots);
      // ---- persistence + tournament
      var wins0=G.save.wins;begin('cpu',{level:0,target:3});dropBall(R,0,{three:true,points:3,hoop:1});tick(0.4);
      ok('win vs CPU recorded',G.phase==='over'&&G.save.wins===wins0+1);
      var stored=null;try{stored=JSON.parse(localStorage.getItem(KEY));}catch(e){}
      ok('progress persisted under basketball.v2 (or storage unavailable)',stored===null||(stored.save&&stored.save.wins===G.save.wins&&stored.settings&&stored.settings.last));
      var tr=newTournament({team:2,player:1});ok('tournament: 4 distinct opponents, none is your team',tr.round===0&&tr.opps.length===4&&tr.opps.indexOf(2)<0&&new Set(tr.opps).size===4);
      startTourRound();ok('tournament round 1 starts vs opponent 1 on easy',G.mode==='tour'&&G.level===0&&G.players[0].team.i===2&&G.players[1].team.i===tr.opps[0]&&G.players[1].cpu);
      G.phase='play';G.scores[0]=9;endMatch();ok('tournament win advances the round and is saved',G.tour.round===1&&(stored===null||JSON.parse(localStorage.getItem(KEY)).tour.round===1));
      startTourRound();ok('round 2 is harder',G.level===1&&G.round===1);G.phase='play';G.scores[1]=9;endMatch();ok('tournament loss clears the progress',G.tour===null);
      // ---- menu flow: team -> player -> match
      show('s-menu');beginFlow('cpu');ok('team pick screen shows 20 badges',G.screen==='s-team'&&$('t-grid').children.length===20);
      $('t-grid').children[4].click();ok('player pick screen shows the 15 players of the chosen team with animated previews',G.screen==='s-player'&&$('p-grid').children.length===TEAMS[4].players.length&&previews.length===TEAMS[4].players.length);
      $('p-grid').children[2].click();ok('picking a player starts the match with a random other CPU team',G.screen==='s-game'&&G.players[0].pl===TEAMS[4].players[2]&&G.players[1].team.i!==4&&G.settings.last[0].team===4);
      show('s-menu');beginFlow('2p');$('t-grid').children[0].click();$('p-grid').children[0].click();ok('2P: after P1 picks, P2 picks a team',G.screen==='s-team'&&G.flow.cur===1&&$('t-who').textContent===S.p2);
      $('t-grid').children[1].click();$('p-grid').children[1].click();ok('2P match starts with both picks',G.screen==='s-game'&&G.mode==='2p'&&G.players[1].pl===TEAMS[1].players[1]&&!G.players[1].cpu);
      // ---- pause / lang / layout
      pause(true);ok('pause shows the pause screen',G.screen==='s-pause'&&G.paused);pause(false);ok('resume returns to the game',G.screen==='s-game'&&!G.paused);
      setLang('en');ok('setLang(en): ltr + English strings',document.documentElement.dir==='ltr'&&$('m-title').textContent==='Basketball 1 on 1'&&$('m-keys').textContent.indexOf('P1')===0);
      setLang('he');ok('setLang(he): rtl + Hebrew title',document.documentElement.dir==='rtl'&&$('m-title').textContent==='כדורסל 1 על 1');
      show('s-menu');ok('show(s-menu) returns to the menu with settings + last pick',G.screen==='s-menu'&&$('settings').querySelectorAll('.seg').length===3&&$('m-last').textContent.length>5);
      draw();var r=stage.getBoundingClientRect();ok('stage keeps 16:9',Math.abs(r.width/r.height-16/9)<0.01);
      ok('no overflow',document.documentElement.scrollWidth<=window.innerWidth+1&&r.right<=window.innerWidth+1&&r.bottom<=window.innerHeight+1);
      ok('no runtime errors',ERRS.filter(function(e){return e.indexOf('FAIL')!==0;}).length===0,ERRS.join(' | '));
    }catch(e){errs.push('exception: '+(e&&e.stack||e));}
    done();
  },60);
}
})();
