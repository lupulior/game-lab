// ---------- pure helpers ----------
function idealPower(dist){return clamp(0.42+dist/1100,0.42,0.95);}
function shotVelocity(from,hoop,power){

  var tx=hoop.x+over*sgn,ty=hoop.y-2;
  var Tm=clamp(0.72+dist/900,0.75,1.35);
  var dx=tx-from.x,dy=ty-from.y;
  return {vx:dx/Tm,vy:(dy-0.5*GRAV*Tm*Tm)/Tm,T:Tm,over:over,ideal:ideal};
}
function collideCircleRect(c,r){
  var cx=clamp(c.x,r.x,r.x+r.w),cy=clamp(c.y,r.y,r.y+r.h);
  var dx=c.x-cx,dy=c.y-cy,d2=dx*dx+dy*dy;

  if(d2===0){ // centre inside: push out along the smallest axis
    var l=c.x-r.x,rt=r.x+r.w-c.x,t=c.y-r.y,b=r.y+r.h-c.y,m=Math.min(l,rt,t,b);

function stepBall(b,dt){b.vy+=GRAV*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.spin=(b.spin||0)+b.vx*dt*0.08;return b;}

var AI_LEVELS=[

function aiDecide(s,level){

    goTo(b.x,L.chaseSlack);
    if(me.onGround&&Math.abs(b.x-me.x)<40&&b.y<me.y-120&&b.vy>0&&rng()<0.03)ctl.jump=true;
  }
  return ctl;
}

// ---------- simulation ----------

function tick(dt){

}
function step(h){

  G.netT+=h;G.netSwing*=Math.pow(0.05,h);
  for(var k=G.msgs.length-1;k>=0;k--){G.msgs[k].life-=h;if(G.msgs[k].life<=0)G.msgs.splice(k,1);}
  for(k=G.fx.length-1;k>=0;k--){var f=G.fx[k];f.life-=h;if(f.type==='spark'){f.vy+=600*h;f.x+=f.vx*h;f.y+=f.vy*h;}else{f.y-=40*h;}if(f.life<=0)G.fx.splice(k,1);}

    var ctl=frozen?{left:false,right:false,jump:false,shoot:false}:(p.cpu?aiDecide({me:p,opp:G.players[1-i],ball:ballOf(p).state==='held'||G.race?ballOf(p):G.balls[0],hoop:HOOP,shotClock:G.shotClock,rng:G.rng,race:G.race,phase:G.phase,dt:h},G.level):humanCtl(p));
    if(p.stun>0){p.stun-=h;ctl={left:false,right:false,jump:false,shoot:false};}

function heldBall(){var b=G.balls[0];return b.state==='held'?b:null;}

function updatePlayer(p,h){

  if(!p.onGround){p.vy+=GRAV*h;p.y+=p.vy*h;if(p.y>=FLOOR){p.y=FLOOR;p.vy=0;p.onGround=true;p.squash=1;p.blockT=0;}}

function canDunk(p){return !p.onGround&&Math.abs(p.x-HOOP.x)<80&&(p.y-104)<=HOOP.y+8&&p.vy<260;}
function releaseShot(p){

  var from={x:p.x+8,y:p.y-112};
  var dist=Math.abs(HOOP.x-from.x);
  var noise=(1.12-p.shoot)*0.1*(G.rng()*2-1)*(0.4+dist/500);

  b.shot={three:isThreePointer(from.x,HOOP),dunk:false,perfect:Math.abs(v.over)<15,over:v.over};

  b.shot={three:false,dunk:true,perfect:false,points:2};

    var b=G.balls[0];b.holder=p.i;b.state='held';p.hasBall=true;o.hasBall=false;o.charging=false;o.charge=0;o.stun=0.45;o.ai.plan=null;

function updateBall(b,h){

  // rim ends
  if(!(b.shot&&b.shot.perfect&&!b.touched)){
    for(var e=-1;e<=1;e+=2){var ex=HOOP.x+e*HOOP.r,ey=HOOP.y,dx=b.x-ex,dy=b.y-ey,d=Math.sqrt(dx*dx+dy*dy);
      if(d<b.r+3&&d>0){var nx=dx/d,ny=dy/d;b.x=ex+nx*(b.r+3);b.y=ey+ny*(b.r+3);var vr=b.vx*nx+b.vy*ny;if(vr<0){b.vx-=1.6*vr*nx;b.vy-=1.6*vr*ny;if(Math.abs(vr)>50){sfx('rim');G.netSwing=Math.max(G.netSwing,0.4);}}b.touched=true;}}
  }
  // score
  if(!b.scored&&b.vy>0&&b.prevY<HOOP.y&&b.y>=HOOP.y&&Math.abs(b.x-HOOP.x)<HOOP.r-4){score(b);}
  // floor
  if(b.y+b.r>FLOOR){
    b.y=FLOOR-b.r;
    if(b.vy>0){if(b.vy>90){sfx('bounce',b.vy);b.sq=1;}b.vy=-b.vy*0.62;b.vx*=0.85;if(Math.abs(b.vy)<70)b.vy=0;}
    if(b.state==='flying'){b.state='loose';if(G.race){b.done=true;}}
    if(b.vy===0){b.vx*=Math.pow(0.25,h);if(Math.abs(b.vx)<3)b.vx=0;}
  }
  if(b.y-b.r<0&&b.vy<0){b.y=b.r;b.vy=-b.vy*0.5;}
  if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)*0.7;b.touched=true;}
  if(b.x+b.r>W-14){b.x=W-14-b.r;b.vx=-Math.abs(b.vx)*0.7;b.touched=true;}
  // race: resolve
  if(G.race){
    if(b.scored&&!b.done&&b.y>HOOP.y+60){b.done=true;}
    if(b.age>7)b.done=true;
    if(b.done){b.doneT+=h;if(b.doneT>0.7)respot(b.owner);}
    return;
  }
  // block / pickup
  if(G.phase!=='play')return;
  for(var i=0;i<2;i++){
    var p=G.players[i];
    if(b.state==='flying'&&!b.touched&&b.age<0.45){
      if(i!==b.shooter&&!p.onGround&&intersectsPlayer(p,b,p.blockT>0?14:0)){block(p,b);return;}
    }else if(!b.scored&&!p.hasBall&&intersectsPlayer(p,b,0)){pickup(p,b);return;}
  }
}
function block(p,b){
  b.touched=true;b.vx=-Math.abs(b.vx)*0.6-80;b.vy=Math.min(b.vy,-120);b.shot=null;
  p.stats.blocks++;G.shake=Math.max(G.shake,0.4);msg(S.block,0.9);sfx('block');G.lastEvent={type:'block',player:p.i};
}
function pickup(p,b){
  var changed=(G.possession!==p.i);
  b.state='held';b.holder=p.i;b.shot=null;b.touched=false;p.hasBall=true;G.players[1-p.i].hasBall=false;
  G.possession=p.i;G.shotClock=SHOT_CLOCK;p.ai.plan=null;
  if(changed)G.lastEvent={type:'rebound',player:p.i};
}
function score(b){
  b.scored=true;var sh=b.shot||{points:2};var i=b.shooter<0?0:b.shooter,p=G.players[i];
  var pts=sh.points||scoreFor(sh);
  G.scores[i]+=pts;p.stats.pts+=pts;p.stats.made++;if(pts===3)p.stats.threes++;if(sh.dunk)p.stats.dunks++;
  var swish=!!sh.perfect&&!b.touched;
  G.netSwing=1;b.vx*=0.3;b.vy=Math.max(b.vy*0.45,110);
  pop(HOOP.x-40,HOOP.y-60,'+'+pts,p.char.c1);
  if(swish){sparkle(HOOP.x,HOOP.y+10,18);msg(S.swish,1.0);sfx('swish');}else if(!sh.dunk)sfx('score');
  G.lastEvent={type:'score',player:i,points:pts,swish:swish,dunk:!!sh.dunk};
  if(!G.race){
    if(G.scores[i]>=G.target){endMatch();}
    else{G.phase='score';G.phaseT=1.3;G.nextPoss=1-i;}
  }
}
function turnover(){
  msg(S.turnover,1.0);sfx('buzz');
  var b=G.balls[0],hol=b.holder;
  G.players[hol].charging=false;G.players[hol].charge=0;
  G.phase='score';G.phaseT=1.0;G.nextPoss=1-G.possession;G.lastEvent={type:'turnover'};
}
function endMatch(){
  if(G.phase==='over')return;
  G.phase='over';G.overT=1.8;
  var a=G.scores[0],b=G.scores[1];G.winner=a>b?0:b>a?1:-1;
  for(var i=0;i<2;i++){var p=G.players[i];p.charging=false;p.ctl={left:false,right:false,jump:false,shoot:false};}
  msg(isFinite(G.clock)&&G.clock<=0?S.timeUp:'',1.5);
  sfx('buzzer');burstConfetti();
  if(G.mode==='cpu'||G.mode==='race-cpu'){
    G.save.games++;
    if(G.winner===0){G.save.wins++;G.save.streak++;G.save.best=Math.max(G.save.best,G.save.streak);}
    else if(G.winner===1){G.save.losses++;G.save.streak=0;}
    persist();
  }
}

// ---------- audio ----------
var AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}return AC;}
function sfx(name,arg){
  if(G.mute||G.manual)return;var c=ac();if(!c)return;
  try{
    if(c.state==='suspended')c.resume();
    var t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
    var env=function(v,dur){g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.start(t);o.stop(t+dur+0.02);};
    switch(name){
      case 'bounce':{var v=clamp((arg||300)/900,0.15,1);o.type='sine';o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(60,t+0.13);env(0.5*v,0.15);break;}
      case 'rim':o.type='triangle';o.frequency.setValueAtTime(1300,t);o.frequency.exponentialRampToValueAtTime(700,t+0.18);env(0.22,0.22);break;
      case 'board':o.type='square';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(180,t+0.1);env(0.12,0.12);break;
      case 'shoot':o.type='sine';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(900,t+0.1);env(0.06,0.12);break;
      case 'score':o.type='sine';o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+0.09);o.frequency.setValueAtTime(784,t+0.18);env(0.2,0.4);break;
      case 'swish':{o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1320,t+0.1);o.frequency.setValueAtTime(1760,t+0.2);env(0.18,0.5);
        var buf=c.createBuffer(1,c.sampleRate*0.3,c.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
        var src=c.createBufferSource(),f=c.createBiquadFilter(),g2=c.createGain();src.buffer=buf;f.type='bandpass';f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(900,t+0.3);g2.gain.value=0.25;src.connect(f);f.connect(g2);g2.connect(c.destination);src.start(t);break;}
      case 'dunk':o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(35,t+0.35);env(0.6,0.4);break;
      case 'buzzer':o.type='sawtooth';o.frequency.setValueAtTime(190,t);env(0.25,0.9);break;
      case 'buzz':o.type='square';o.frequency.setValueAtTime(240,t);env(0.12,0.35);break;
      case 'whistle':o.type='sine';o.frequency.setValueAtTime(2100,t);o.frequency.setValueAtTime(2300,t+0.08);o.frequency.setValueAtTime(2100,t+0.16);o.frequency.setValueAtTime(2300,t+0.24);env(0.12,0.4);break;
      case 'steal':o.type='triangle';o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(1200,t+0.12);env(0.18,0.16);break;
      case 'block':o.type='square';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(90,t+0.15);env(0.2,0.18);break;
      default:return;
    }
  }catch(e){}
}

var cv=$('cv'),ctx=cv.getContext('2d'),dpr=1;

function draw(){
  var s=G.scale*dpr;
  ctx.setTransform(s,0,0,s,0,0);
  ctx.fillStyle=C.court;ctx.fillRect(0,0,W,H);
  var inGame=G.screen==='s-game'||G.screen==='s-pause'||G.screen==='s-over';
  if(!inGame){ctx.save();ctx.translate(0,46);drawCourt(0.5);ctx.globalAlpha=0.3;drawHoop(true);drawHoop(false);ctx.restore();return;}
  var sx=0,sy=0;if(G.shake>0){sx=(G.rng()-0.5)*G.shake*10;sy=(G.rng()-0.5)*G.shake*8;}
  ctx.save();ctx.translate(sx,sy);
  drawCourt(1);drawHoop(true);

  for(var i=0;i<ps.length;i++)drawPlayer(ps[i],1);
  for(i=0;i<G.balls.length;i++)drawBall(G.balls[i]);
  drawHoop(false);
  for(i=0;i<G.players.length;i++)drawPowerBar(G.players[i]);
  drawFx();
  ctx.restore();
  drawHUD();

function drawCourt(alpha){
  ctx.globalAlpha=alpha;
  ctx.fillStyle=C.soft;ctx.fillRect(0,FLOOR,W,H-FLOOR);
  // key (paint) under the hoop
  ctx.globalAlpha=alpha*0.55;ctx.fillStyle=C.court;ctx.fillRect(HOOP.x-190,FLOOR+10,190,H-FLOOR-10);
  ctx.globalAlpha=alpha;
  ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,FLOOR);ctx.lineTo(W,FLOOR);ctx.stroke();
  ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(HOOP.x-190,FLOOR+10);ctx.lineTo(HOOP.x-190,H);ctx.stroke();

function drawHoop(back){
  ctx.strokeStyle=C.ink;ctx.lineCap='round';
  if(back){
    // pole + bracket + backboard
    ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(W-14,FLOOR);ctx.lineTo(W-14,BOARD.y+10);ctx.lineTo(BOARD.x+BOARD.w,BOARD.y+10);ctx.stroke();

function drawNet(){

  ctx.strokeStyle=C.ink;ctx.lineWidth=1.2;ctx.globalAlpha=0.55;
  var top=HOOP.y+2,bot=HOOP.y+40,n=6;

function drawPlayer(p,alpha,noName){

  ctx.fillStyle=C.ink;ctx.globalAlpha=alpha*0.12*(1-air*0.6);ctx.beginPath();ctx.ellipse(p.x,FLOOR+3,22*(1-air*0.4),5*(1-air*0.4),0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=alpha;

  else if(p.swipe>0){ctx.moveTo(-13*p.facing,-74);ctx.lineTo(-16*p.facing,-44);ctx.moveTo(13*p.facing,-74);ctx.lineTo(34*p.facing,-60);}

function drawPowerBar(p){

// ---------- UI ----------
function show(id){
  var scr=document.querySelectorAll('.screen');
  for(var i=0;i<scr.length;i++)scr[i].classList.toggle('on',scr[i].id===id||(id==='s-pause'&&scr[i].id==='s-game')||(id==='s-over'&&scr[i].id==='s-game'));
  G.screen=id;document.body.classList.toggle('paused',id==='s-pause'||id==='s-over');
  if(id==='s-menu'){G.phase='idle';renderMenu();}
}
function start(mode,opts){
  opts=opts||{};opts.mode=mode;
  input.clear();
  newMatch(opts);
  G.lastMode=mode;G.lastOpts=opts;
  show('s-game');
  return G;
}
function pause(on){

      ok('menu renders 2 pickers + 3 setting rows + tip',$('pick0').querySelector('.nm')&&$('pick1').querySelector('.nm')&&$('settings').querySelectorAll('.seg').length===3&&$('m-tip').textContent.length>5);
      // layout
      var r=stage.getBoundingClientRect();ok('stage keeps 16:9',Math.abs(r.width/r.height-16/9)<0.01,r.width+'x'+r.height);
      ok('no overflow',document.documentElement.scrollWidth<=window.innerWidth+1&&r.right<=window.innerWidth+1&&r.bottom<=window.innerHeight+1);
      ok('no runtime errors',ERRS.filter(function(e){return e.indexOf('FAIL')!==0;}).length===0);
    }catch(e){errs.push('exception: '+(e&&e.stack||e));}
    done();
  },60);
}
})();
</script>
