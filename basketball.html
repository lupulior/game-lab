  return {vx:dx/Tm,vy:(dy-0.5*GRAV*Tm*Tm)/Tm,T:Tm,over:over,ideal:ideal};
}
function collideCircleRect(c,r){
  var cx=clamp(c.x,r.x,r.x+r.w),cy=clamp(c.y,r.y,r.y+r.h);
  var dx=c.x-cx,dy=c.y-cy,d2=dx*dx+dy*dy;

  if(d2===0){var l=c.x-r.x,rt=r.x+r.w-c.x,t=c.y-r.y,b=r.y+r.h-c.y,m=Math.min(l,rt,t,b);

  var d=Math.sqrt(d2);return{nx:dx/d,ny:dy/d,depth:c.r-d};

 {react:0.3,gap:58,err:0.09,threeP:0.4,dunk:true,stealP:0.5,behindP:0.08,blockP:0.6,blockAt:0.25,delay:0.7,chaseSlack:12,jumpErr:0.18,careful:true},
 {react:0.12,gap:44,err:0.03,threeP:0.5,dunk:true,stealP:0.75,behindP:0,blockP:0.9,blockAt:0.14,delay:0.35,chaseSlack:4,jumpErr:0.06,careful:true}
];
function aiDecide(s,level){
  var L=AI_LEVELS[clamp(level|0,0,2)],me=s.me,opp=s.opp,b=s.ball,rng=s.rng,ai=me.ai,h=s.dt||STEP,d=s.adir||1,hp=s.hoop;
  var ctl={left:false,right:false,jump:false,shoot:false};
  if(s.phase==='jump'){
    if(ai.jumpOff==null)ai.jumpOff=(rng()*2-1)*L.jumpErr;
    if(s.jump&&s.jump.t>=s.jump.apex+ai.jumpOff&&s.jump.press[me.i]==null)ctl.jump=true;
    return ctl;
  }
  if(s.phase==='ft'){
    if(!me.hasBall)return ctl;
    if(!ai.plan)ai.plan={kind:'ft',spot:me.x,power:clamp(idealPower(FT_DIST)+(rng()*2-1)*L.err*0.8,0.05,1),waited:0};
    ai.plan.waited+=h;
    if(ai.plan.waited>0.6||me.charging){if(!me.charging)ctl.shoot=true;else if(me.charge<ai.plan.power)ctl.shoot=true;}
    return ctl;
  }
  if(s.phase!=='play')return ctl;
  ai.reactT-=h;
  var goTo=function(x,slack){var dd=x-me.x;if(Math.abs(dd)>(slack||6)){if(dd>0)ctl.right=true;else ctl.left=true;}};
  if(me.hasBall){
    if(!ai.plan){
      var r=rng(),kind;
      var oppBehind=(opp.x-me.x)*d<-30;
      if(L.dunk&&oppBehind&&r<0.45)kind='dunk';
      else if(L.dunk&&r>0.85)kind='dunk';
      else if(rng()<L.threeP)kind='three';else kind='mid';
      var spot=kind==='dunk'?hp.x-d*46:kind==='three'?hp.x-d*(THREE_DIST+12+rng()*50):hp.x-d*(110+rng()*170);
      spot=clamp(spot,COURT.l+20,COURT.r-20);
      var dist=Math.abs(hp.x-spot);
      ai.plan={kind:kind,spot:spot,power:clamp(idealPower(dist)+(rng()*2-1)*L.err,0.05,1),waited:0};
    }
    var pl=ai.plan;
    if(pl.kind==='dunk'){
      goTo(pl.spot,10);

      }

    }else{
      var atSpot=Math.abs(me.x-pl.spot)<8;
      if(!atSpot&&s.shotClock>2)goTo(pl.spot);
      else{
        pl.waited+=h;
        var pressured=(opp.x-me.x)*d>0&&Math.abs(opp.x-me.x)<60&&opp.onGround;
        if(pressured&&level>0&&pl.waited<2.2&&s.shotClock>4&&!me.charging){
          if(ai.reactT<=0){pl.spot=clamp(pl.spot-d*(60+rng()*80),COURT.l+20,COURT.r-20);var d2=Math.abs(hp.x-pl.spot);pl.power=clamp(idealPower(d2)+(rng()*2-1)*L.err,0.05,1);ai.reactT=0.4;}
        }else if(pl.waited>L.delay||s.shotClock<2.5||me.charging){
          if(!me.charging)ctl.shoot=true;
          else if(me.charge<pl.power)ctl.shoot=true;
          else ctl.shoot=false;
        }
      }
    }
  }else if(b.state==='held'){
    var od=-d; // opponent attacks the other way
    if(ai.reactT<=0){ai.reactT=L.react;ai.target=clamp(opp.x+od*L.gap,COURT.l+30,COURT.r-30);ai.wantSteal=rng()<L.stealP;ai.wantBlock=rng()<L.blockP;ai.behind=rng()<L.behindP;}
    var dx=Math.abs(me.x-opp.x);
    var oppAir=!opp.onGround;
    if(L.careful&&oppAir&&dx<34){/* stop: do not run into a shooter */}
    else if(ai.target!=null)goTo(ai.target);
    var inFront=(me.x-opp.x)*od>0;
    if(ai.wantSteal&&dx<44&&me.onGround&&me.stealCd<=0&&opp.onGround&&(inFront||ai.behind))ctl.shoot=true;
    if(ai.wantBlock&&me.onGround&&dx<80&&((opp.charging&&opp.charge>L.blockAt)||(oppAir&&opp.vy<0)))ctl.jump=true;
  }else{
    goTo(b.x,L.chaseSlack);
    if(me.onGround&&Math.abs(b.x-me.x)<40&&b.y<me.y-100&&b.vy>0&&rng()<0.03)ctl.jump=true;
  }

}
function aiState(p,h){return {me:p,opp:G.players[1-p.i],ball:G.ball,hoop:attackHoop(p.i),own:ownHoop(p.i),adir:adir(p.i),phase:G.phase,jump:G.jump,shotClock:G.shotClock,rng:G.rng,dt:h};}

function tick(dt){var n=Math.max(1,Math.ceil(dt/STEP-1e-9)),h=dt/n;for(var i=0;i<n;i++)step(h);}
function step(h){
  if(G.phase==='idle')return;
  G.time+=h;G.shake=Math.max(0,G.shake-h*3.5);G.netT+=h;G.netSwing[0]*=Math.pow(0.05,h);G.netSwing[1]*=Math.pow(0.05,h);G.cheer=Math.max(0,G.cheer-h);G.foulCd=Math.max(0,G.foulCd-h);
  var k;for(k=G.msgs.length-1;k>=0;k--){G.msgs[k].life-=h;if(G.msgs[k].life<=0)G.msgs.splice(k,1);}
  for(k=G.fx.length-1;k>=0;k--){var f=G.fx[k];f.life-=h;if(f.type==='spark'){f.vy+=600*h;f.x+=f.vx*h;f.y+=f.vy*h;}else{f.y-=40*h;}if(f.life<=0)G.fx.splice(k,1);}
  for(k=G.dust.length-1;k>=0;k--){var d=G.dust[k];d.life-=h;d.x+=d.vx*h;d.y+=d.vy*h;d.r+=14*h;if(d.life<=0)G.dust.splice(k,1);}
  for(k=G.confetti.length-1;k>=0;k--){var c=G.confetti[k];c.vy+=200*h;c.vx*=Math.pow(0.6,h);c.x+=c.vx*h;c.y+=c.vy*h;c.rot+=c.vr*h;if(c.y>H+30)G.confetti.splice(k,1);}

  else if(G.phase==='jump'){G.jump.t+=h;if(G.jump.t>=G.jump.apex+0.55)resolveJumpBall();}

  else if(G.phase==='whistle'){G.phaseT-=h;if(G.phaseT<=0){var nx=G.next;G.next=null;if(nx&&nx.type==='ft')startFT(nx.shooter);else inbound(nx?nx.who:1-G.possession);}}
  else if(G.phase==='halftime'){G.phaseT-=h;if(G.phaseT<=0){swapSides();if(G.otNext){G.period++;G.clock=60;G.clockMax=60;G.otNext=false;startJumpBall();}else{G.period=2;G.clock=G.halfLen;G.clockMax=G.halfLen;inbound(1);}}}

  }
  var frozen=!(G.phase==='play'||G.phase==='ft'||G.phase==='jump');
  for(var i=0;i<2;i++){
    var p=G.players[i];
    if(p.out>0){p.out-=h;if(p.out<=0){p.out=0;var own=ownHoop(i);p.x=own.x+own.dir*120;p.y=FLOOR;p.vy=0;p.onGround=true;}continue;}
    var ctl=frozen?{left:false,right:false,jump:false,shoot:false}:(p.cpu?aiDecide(aiState(p,h),G.level):humanCtl(p));

    p.ctl=ctl;updatePlayer(p,h);
  }
  if(G.phase==='play'){var a=G.players[0],b=G.players[1];if(a.out<=0&&b.out<=0&&a.onGround&&b.onGround){var dd=b.x-a.x;if(Math.abs(dd)<PW){var push=(PW-Math.abs(dd))/2,sg=dd>=0?1:-1;a.x-=push*sg;b.x+=push*sg;a.x=clamp(a.x,COURT.l+10,COURT.r-10);b.x=clamp(b.x,COURT.l+10,COURT.r-10);}}checkShootingFoul();}
  updateBall(G.ball,h);

function updatePlayer(p,h){
  var c=p.ctl,pr=p.prev;
  var jumpEdge=c.jump&&!pr.jump,shootEdge=c.shoot&&!pr.shoot,releaseEdge=!c.shoot&&pr.shoot;
  var lock=G.phase==='jump'||G.phase==='ft';
  var dir=lock?0:(c.right?1:0)-(c.left?1:0);
  p.vx=dir*p.speed*(p.charging?0.3:1);
  if(dir)p.facing=dir;else if(p.hasBall&&G.phase==='play')p.facing=adir(p.i);else if(!lock&&!p.hasBall)p.facing=G.ball.x>=p.x?1:-1;
  p.x=clamp(p.x+p.vx*h,COURT.l+10,COURT.r-10);
  if(jumpEdge&&p.onGround&&G.phase!=='ft'){if(G.phase==='jump'&&G.jump.press[p.i]==null)G.jump.press[p.i]=G.jump.t;p.vy=-p.jumpV;p.onGround=false;}

    if(shootEdge){if(G.phase==='play'&&canDunk(p))dunk(p);else{p.charging=true;p.charge=0;}}
    if(p.charging&&p.hasBall){
      if(G.phase==='play'&&!p.onGround&&canDunk(p)){dunk(p);}
      else{p.charge+=h/CHARGE_TIME;if(p.charge>=1){p.charge=1;releaseShot(p);}else if(releaseEdge){releaseShot(p);}}

function canDunk(p){var hp=attackHoop(p.i);return !p.onGround&&Math.abs(p.x-hp.x)<60&&(p.y-84)<=hp.y+8&&p.vy<260;}
function releaseShot(p){

  var hp=G.phase==='ft'?HOOPS[G.ft.hoop]:attackHoop(p.i);

  var dist=Math.abs(hp.x-from.x);

function dunk(p){

function trySteal(p){

    var b=G.ball;b.holder=p.i;b.state='held';b.lastTouch=p.i;p.hasBall=true;o.hasBall=false;o.charging=false;o.charge=0;o.stun=0.45;o.ai.plan=null;

        if(d<b.r+3&&d>0){var nx=dx/d,ny=dy/d;b.x=ex+nx*(b.r+3);b.y=ey+ny*(b.r+3);var vr=b.vx*nx+b.vy*ny;if(vr<0){b.vx-=1.6*vr*nx;b.vy-=1.6*vr*ny;if(Math.abs(vr)>50){sfx('rim');G.netSwing[k]=Math.max(G.netSwing[k],0.4);}}b.touched=true;}}

  var hp=HOOPS[hoopIdx];pop(hp.x+hp.dir*40,hp.y-50,'+'+pts,p.team.c1);

function endMatch(){

var AC=null;

function sfx(name,arg){

      case 'land':o.type='sine';o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(50,t+0.08);env(0.12,0.09);break;
      case 'rim':o.type='triangle';o.frequency.setValueAtTime(1300,t);o.frequency.exponentialRampToValueAtTime(700,t+0.18);env(0.22,0.22);break;
      case 'board':o.type='square';o.frequency.setValueAtTime(320,t);o.frequency.exponentialRampToValueAtTime(180,t+0.1);env(0.12,0.12);break;
      case 'shoot':o.type='sine';o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(900,t+0.1);env(0.06,0.12);break;
      case 'score':o.type='sine';o.frequency.setValueAtTime(523,t);o.frequency.setValueAtTime(659,t+0.09);o.frequency.setValueAtTime(784,t+0.18);env(0.2,0.4);break;
      case 'swish':{o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.setValueAtTime(1320,t+0.1);o.frequency.setValueAtTime(1760,t+0.2);env(0.18,0.5);
        var buf=c.createBuffer(1,c.sampleRate*0.3,c.sampleRate),d=buf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
        var src=c.createBufferSource(),f=c.createBiquadFilter(),g2=c.createGain();src.buffer=buf;f.type='bandpass';f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(900,t+0.3);g2.gain.value=0.25;src.connect(f);f.connect(g2);g2.connect(c.destination);src.start(t);break;}
      case 'dunk':o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(35,t+0.35);env(0.6,0.4);break;
      case 'buzzer':o.type='sawtooth';o.frequency.setValueAtTime(190,t);env(0.25,0.9);break;
      case 'buzz':o.type='square';o.frequency.setValueAtTime(240,t);env(0.12,0.35);break;
      case 'whistle':o.type='sine';o.frequency.setValueAtTime(2100,t);o.frequency.setValueAtTime(2300,t+0.08);o.frequency.setValueAtTime(2100,t+0.16);o.frequency.setValueAtTime(2300,t+0.24);env(0.12,0.4);break;
      case 'steal':o.type='triangle';o.frequency.setValueAtTime(400,t);o.frequency.exponentialRampToValueAtTime(1200,t+0.12);env(0.18,0.16);break;
      case 'block':o.type='square';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(90,t+0.15);env(0.2,0.18);break;

    }
